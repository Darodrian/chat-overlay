<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="assets/themes/ff8/ff8.js"></script>
    <script src="assets/themes/ct/ct.js"></script>
    <script src="assets/themes/acww/acww.js"></script>
    <script src="assets/themes/ff7/ff7.js"></script>
    <script src="assets/themes/fft/fft.js"></script>
    <script src="assets/themes/minishcap/minishcap.js"></script>
    <script src="assets/themes/mmbn1/mmbn1.js"></script>

    <style>
        :root {
            --ff-bg: rgba(10, 10, 46, 0.6);
            --ff-border: #c8aa6e;
            --ff-text: #f0e6d3;
            --ff-username: #5ca0f0;
            --ff-timestamp: #7a7a9a;
            --ff-dim: rgba(240, 230, 211, 0.35);
            --ff-mod: #ce331d;
            --ff-sub: #49a026;
            --ff-vip: #c532ad;

            --ui-username: #f4f1ea;
            --ui-dim: rgba(244, 241, 234, 0.5);
            --ui-mod: #ce331d;
            --ui-sub: #49a026;
            --ui-vip: #c532ad;
            --ui-broadcaster: #e1b70b;
            --ui-lh: 32px;
            --ui-y: 0px;
            --ui-top: 0px;
            --ui-bot: 0px;
            --ui-hx: 0px;
        }

        @font-face {
            font-family: 'Zpix';
            src: url("assets/fonts/zpix.woff2") format("woff2");
            font-display: swap;
        }

        /* Per-theme webfonts, selected by theme.fontFamily in THEMES. */
        @font-face {
            font-family: 'ChronoType';
            src: url("assets/fonts/ChronoType.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: 'Altima';
            src: url("assets/fonts/Altima.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: 'MinishType';
            src: url("assets/fonts/MinishType.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: 'BN5DSEUFontThin';
            src: url("assets/fonts/BN5DSEU Font Thin.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: 'ZpixBig';
            src: url("assets/fonts/zpix.woff2") format("woff2");
            font-display: swap;
            size-adjust: 150%;
        }

        @font-face {
            font-family: 'Reactor7';
            src: url("assets/fonts/Reactor7.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: 'PMDFont';
            src: url("assets/fonts/pmd.woff2") format("woff2");
            font-display: swap;
        }

        html, body {
            margin: 0;
            font-family: 'Zpix', monospace;
        }

        #chat {
            width: 600px;
            height: 1000px;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column-reverse;
            box-sizing: border-box;
            padding: 20px;
        }

        #chat:not(.no-bg) {
            background-color: var(--ff-bg);
            border: 6px solid var(--ff-border);
        }

        #chat.no-bg {
            background-color: transparent;
            border: 6px solid transparent;
        }

        #chat ul {
            list-style-type: none;
            list-style-position: outside;
            padding: 0;
            margin: 0;
        }

        /* ---- Setup notice (shown until a channel is set) ---- */
        #setup-notice {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            font-family: 'Zpix', monospace;
        }
        #setup-notice.show { display: flex; }

        #setup-notice .setup-box {
            box-sizing: border-box;
            max-width: 480px;
            margin: 16px;
            padding: 24px 28px;
            background: rgba(10, 10, 30, 0.92);
            border: 4px solid #c8aa6e;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
            color: #f0e6d3;
            text-align: center;
        }

        #setup-notice h1 {
            margin: 0 0 16px 0;
            font-size: 20px;
            letter-spacing: 2px;
            color: #c8aa6e;
        }

        #setup-notice p {
            margin: 0 0 12px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        #setup-notice p:last-child { margin-bottom: 0; }

        #setup-notice b { color: #ffffff; }

        #setup-notice code {
            padding: 1px 5px;
            background: rgba(200, 170, 110, 0.18);
            border: 1px solid rgba(200, 170, 110, 0.45);
            color: #f0e6d3;
        }

        /* ---- Default (Zpix webfont) theme ---- */
        #chat.theme-default {
            color: var(--ff-text);
            text-shadow: 2px 0 0 rgba(0,0,0,0.85), -2px 0 0 rgba(0,0,0,0.85),
                         0 2px 0 rgba(0,0,0,0.85), 0 -2px 0 rgba(0,0,0,0.85);
        }

        #chat.theme-default li {
            padding: 12px 4px;
            font-size: 24px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            border-bottom: 2px dashed rgba(200, 170, 110, 0.35);
        }

        #chat.theme-default .user {
            color: var(--ff-username);
        }

        #chat.theme-default .user.mod { color: var(--ff-mod); }
        #chat.theme-default .user.sub { color: var(--ff-sub); }
        #chat.theme-default .user.vip { color: var(--ff-vip); }

        #chat.theme-default blockquote {
            margin: 8px 0 0 28px;
            color: var(--ff-text);
        }

        #chat.theme-default .timestamp {
            color: var(--ff-timestamp);
            font-size: 24px;
            margin-left: 12px;
        }

        /* ---- Atlas (crisp pixel font) themes ---- */
        #chat.theme-ff8, #chat.theme-ct, #chat.theme-acww, #chat.theme-ff7, #chat.theme-fft, #chat.theme-mc, #chat.theme-mmbn1, #chat.theme-pmd {
            color: var(--ui-body-color, #ffffff);
        }

        #chat.theme-ff8 li, #chat.theme-ct li, #chat.theme-acww li, #chat.theme-ff7 li, #chat.theme-fft li, #chat.theme-mc li, #chat.theme-mmbn1 li, #chat.theme-pmd li {
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 480px;
            box-sizing: border-box;
            background: transparent;
            border: none;
            position: relative;
            transform-origin: center;
            animation: pop 0.18s ease-out; /* keep in sync with POP_MS */
        }

        #chat.theme-ff8 .window-bg, #chat.theme-ct .window-bg, #chat.theme-acww .window-bg, #chat.theme-ff7 .window-bg, #chat.theme-fft .window-bg, #chat.theme-mc .window-bg, #chat.theme-mmbn1 .window-bg, #chat.theme-pmd .window-bg {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            image-rendering: pixelated;
            z-index: 0;
        }

        #chat.theme-ff8 .msg-box, #chat.theme-ct .msg-box, #chat.theme-acww .msg-box, #chat.theme-ff7 .msg-box, #chat.theme-fft .msg-box, #chat.theme-mc .msg-box, #chat.theme-mmbn1 .msg-box, #chat.theme-pmd .msg-box {
            position: relative;
            z-index: 1;
            padding: 20px 24px 16px 24px;
            background: transparent;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        #chat.theme-ff8 li + li, #chat.theme-ct li + li, #chat.theme-acww li + li, #chat.theme-ff7 li + li, #chat.theme-fft li + li, #chat.theme-mc li + li, #chat.theme-mmbn1 li + li, #chat.theme-pmd li + li {
            margin-top: 20px;
        }

        #chat.theme-ff8 .msg-box .username, #chat.theme-ct .msg-box .username, #chat.theme-acww .msg-box .username, #chat.theme-ff7 .msg-box .username, #chat.theme-fft .msg-box .username, #chat.theme-mc .msg-box .username, #chat.theme-mmbn1 .msg-box .username, #chat.theme-pmd .msg-box .username {
            color: var(--ui-user-color, var(--ui-username));
            font-size: var(--ui-fs, 24px);
            line-height: var(--ui-lh, 32px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            word-break: break-word;
        }

        #chat.theme-ff8 .msg-header, #chat.theme-ct .msg-header, #chat.theme-acww .msg-header, #chat.theme-ff7 .msg-header, #chat.theme-fft .msg-header, #chat.theme-mc .msg-header, #chat.theme-mmbn1 .msg-header, #chat.theme-pmd .msg-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        #chat.theme-ff8 .msg-header .username, #chat.theme-ct .msg-header .username, #chat.theme-acww .msg-header .username, #chat.theme-ff7 .msg-header .username, #chat.theme-fft .msg-header .username, #chat.theme-mc .msg-header .username, #chat.theme-mmbn1 .msg-header .username, #chat.theme-pmd .msg-header .username {
            margin-bottom: 0;
        }

        #chat.theme-ff8 .msg-header .timestamp, #chat.theme-ct .msg-header .timestamp, #chat.theme-acww .msg-header .timestamp, #chat.theme-ff7 .msg-header .timestamp, #chat.theme-fft .msg-header .timestamp, #chat.theme-mc .msg-header .timestamp, #chat.theme-mmbn1 .msg-header .timestamp, #chat.theme-pmd .msg-header .timestamp {
            font-size: var(--ui-fs, 24px);
            line-height: var(--ui-lh, 32px);
            opacity: 0.55;
            margin-left: 12px;
        }

        #chat.theme-ff8 .msg-box .message-text, #chat.theme-ct .msg-box .message-text, #chat.theme-acww .msg-box .message-text, #chat.theme-ff7 .msg-box .message-text, #chat.theme-fft .msg-box .message-text, #chat.theme-mc .msg-box .message-text, #chat.theme-mmbn1 .msg-box .message-text, #chat.theme-pmd .msg-box .message-text {
            margin: 0;
            color: var(--ui-body-color, #ffffff);
            font-size: var(--ui-fs, 24px);
            line-height: var(--ui-lh, 32px);
            white-space: normal;
            word-break: break-word;
        }

        #chat.theme-ff8 .ui-zpix {
            display: inline-block;
            vertical-align: 6px;
            color: #dcdcdc;
            text-shadow: 1px 1px 0 #333;
        }

        #chat.theme-ff8 .msg-box .username {
            display: inline-block;
        }

        #chat.theme-ff8 .msg-box img.badge {
            height: 0.8em;
            vertical-align: 6px;
        }

        /* ---- Webfont themes: fixed per-theme size, nearest-neighbour pixel glyphs ---- */
        #chat.theme-ct, #chat.theme-fft, #chat.theme-mc, #chat.theme-mmbn1, #chat.theme-ff7, #chat.theme-pmd {
            font-family: var(--ui-font, inherit);
            text-shadow: var(--ui-text-shadow, none);
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        #chat.theme-ct .msg-box .username {
            display: inline-block;
        }

        #chat.theme-ct .msg-box img.badge {
            height: 0.6em;
            vertical-align: 6px;
        }

        /* Role colours for inlineName themes (mc, mmbn1), which no longer have
           per-role atlas rows. The span's own declaration always beats the
           colour it would otherwise inherit from .message-text. */
        #chat .user.mod { color: var(--ui-mod); }
        #chat .user.sub { color: var(--ui-sub); }
        #chat .user.vip { color: var(--ui-vip); }
        #chat .user.broadcaster { color: var(--ui-broadcaster); }

        #chat.theme-acww li { max-width: none; }

        #chat.theme-acww .msg-box {
            width: 512px;
            box-sizing: border-box;
            padding: 24px 0 32px 0;
        }

        #chat.theme-acww .msg-header {
            position: relative;
            height: 48px;
            margin: 0;
        }

        #chat.theme-acww .name-tag {
            position: absolute;
            left: 56px;
            top: -24px;
            min-width: 178px;
            height: 44px;
            image-rendering: pixelated;
            z-index: 1;
        }

        #chat.theme-acww .msg-header .username {
            position: absolute;
            left: 90px;
            top: -15px;
            z-index: 2;
            line-height: 26px;
            white-space: nowrap;
            flex-wrap: nowrap;
            color: #000;
        }

        #chat.theme-acww .msg-header .timestamp {
            position: absolute;
            right: 130px;
            top: 20px;
            z-index: 2;
            opacity: 0.9;
            margin-left: 0;
        }

        #chat.theme-acww .msg-box .message-text { margin: 4px 90px 0 90px; }

        #chat.theme-acww .continue-arrow {
            position: absolute;
            right: 55px;
            bottom: 20px;
            width: 32px;
            height: 34px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-ff7 .msg-box {
            padding: 12px 24px 16px 16px;
        }

        #chat.theme-ff7 .msg-box .username {
            display: inline-block;
        }

        #chat.theme-ff7 .msg-box img.badge {
            height: 0.6em;
            vertical-align: 2px;
        }

        #chat.theme-fft li {
            max-width: 400px;
            min-width: 280px;
        }

        #chat.theme-fft .msg-box {
            padding: 30px 12px 12px 102px;
            min-height: 102px;
        }

        #chat.theme-fft .msg-header {
            margin: 0;
        }

        #chat.theme-fft .portrait {
            position: absolute;
            left: 12px;
            top: 32px;
            width: 80px;
            height: 96px;
            image-rendering: pixelated;
            z-index: 2;
        }

        #chat.theme-fft .msg-box .message-text {
            margin: 2px 0 0 0;
        }

        #chat.theme-fft .msg-box img.badge {
            height: 0.6em
        }

        #chat.theme-mc li {
            min-width: 320px;
        }

        #chat.theme-mc .msg-box {
            padding: 16px 28px 16px 22px;
            min-height: 96px;
            word-spacing: 0.25em;
        }

        #chat.theme-mc .continue-arrow {
            position: absolute;
            right: 32px;
            bottom: 0;
            width: 14px;
            height: 12px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-mc .msg-box img.badge {
            height: 1.4em;
            vertical-align: 0px;
        }

        #chat.theme-mmbn1 li {
            min-width: 320px;
        }

        #chat.theme-mmbn1 .msg-box {
            padding: 24px 16px 16px 106px;
            min-height: 92px;
        }

        #chat.theme-mmbn1 .portrait {
            position: absolute;
            left: 18px;
            top: 20px;
            width: 80px;
            height: 96px;
            image-rendering: pixelated;
            z-index: 2;
        }

        #chat.theme-mmbn1 .continue-arrow {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 26px;
            height: 26px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-mmbn1 .msg-box img.badge {
            height: 0.9em;
            vertical-align: 0px;
        }

        #chat.theme-pmd li {
            flex-direction: row;
            align-items: flex-start;
            max-width: 480px;
        }

        #chat.theme-pmd .msg-box {
            padding: 16px 24px 20px 22px;
            min-height: 60px;
        }

        #chat.theme-pmd .icon-box {
            flex: 0 0 auto;
            margin-right: 8px;
            image-rendering: pixelated;
            z-index: 2;
        }

        #chat.theme-pmd .msg-box img.badge {
            height: 0.8em;
            vertical-align: 0px;
        }

        /* ---- Shared ---- */

        #chat img.badge {
            height: 1em;
            width: auto;
            vertical-align: middle;
            margin-right: 8px;
            display: inline-block;
        }

        #chat .glyph-canvas {
            display: inline-block;
            vertical-align: baseline;
            image-rendering: pixelated;
            position: relative;
            top: var(--ui-y, 0px);
            left: var(--ui-hx, 0px);
        }

        #chat.theme-mc .glyph-canvas {
            vertical-align: -4px;
        }

        #chat.theme-mc .ui-zpix{
            display: inline-block;
            vertical-align: 2px;
        }

        

        #chat .bglyph {
            display: inline-block;
            background-image: var(--ui-atlas, none);
            background-size: var(--ui-bg-size, 2968px 224px);
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        #chat img.emote {
            height: 48px;
            vertical-align: middle;
            display: inline-block;
        }

        #chat.theme-default img.emote {
            height: 2em;
        }

        #chat .e-stack {
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        #chat .e-stack img.emote {
            display: block;
        }

        #chat .e-stack img.emote.overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #chat img.fx-flipx { transform: scaleX(-1); }
        #chat img.fx-flipy { transform: scaleY(-1); }
        #chat img.fx-wide {
            transform: scaleX(2);
            transform-origin: left center;
            margin-right: 2em;
        }
        #chat img.fx-flipx.fx-wide, #chat img.fx-wide.fx-flipx { transform: scaleX(-2); }
        #chat img.fx-cursed { filter: grayscale(1) contrast(1.6) brightness(0.88); }
        #chat img.fx-hyper {
            filter: saturate(3) hue-rotate(300deg) contrast(1.5);
            animation: fx-shake 0.12s linear infinite;
        }
        #chat img.fx-rainbow { animation: fx-rainbow 1s linear infinite; }
        #chat img.fx-jam { animation: fx-jam 0.5s linear infinite; }
        #chat img.fx-bounce { animation: fx-bounce 0.9s ease-in-out infinite; }
        #chat img.fx-spin { animation: fx-spin 1s linear infinite; }

        @keyframes fx-rainbow {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }
        @keyframes fx-shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-3px, 2px); }
            50%  { transform: translate(3px, -2px); }
            75%  { transform: translate(-2px, -3px); }
            100% { transform: translate(2px, 3px); }
        }
        @keyframes fx-jam {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(3px) rotate(-4deg); }
            75%      { transform: translateY(-3px) rotate(4deg); }
        }
        @keyframes fx-bounce {
            0%, 100% { transform: scaleY(1); }
            20%      { transform: scaleY(0.7); }
            40%      { transform: scaleX(-1) scaleY(1); }
            60%      { transform: scaleX(-1) scaleY(0.7); }
            80%      { transform: scaleY(1); }
        }
        @keyframes fx-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        #chat ul.dim-past li:not(:last-of-type) {
            opacity: 0.6;
        }

        #chat ul.hide-badges img.badge-other { display: none; }

        #chat ul.hide-role-badges img.badge-role { display: none; }

        #chat ul.hide-timestamps .timestamp { display: none; }

        #chat ul.fade-expire li { transition: opacity 0.8s ease; }
        #chat ul.fade-expire li.expiring { opacity: 0 !important; }

        #chat ul.align-default li { width: 100%; max-width: none; }
        #chat.theme-pmd ul.align-default .msg-box { flex: 1 1 auto; }

        #chat ul.align-center li     { margin-left: auto; margin-right: auto; }
        #chat ul.align-right li      { margin-left: auto; margin-right: 0; }
        #chat ul.align-alternate li:nth-child(odd)  { margin-left: 0; margin-right: auto; }
        #chat ul.align-alternate li:nth-child(even) { margin-left: auto; margin-right: 0; }

        #chat ul.align-center .msg-content     { margin-left: auto; margin-right: auto; width: fit-content; }
        #chat ul.align-right .msg-content      { margin-left: auto; margin-right: 0;    width: fit-content; }
        #chat ul.align-alternate li:nth-child(odd)  .msg-content { margin-left: 0;    margin-right: auto; width: fit-content; }
        #chat ul.align-alternate li:nth-child(even) .msg-content { margin-left: auto; margin-right: 0;    width: fit-content; }

        #tuner {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: 320px;
            padding: 12px;
            background: #14120f;
            border: 2px solid #54514a;
            box-shadow: 3px 3px 0 #050505;
            color: #f4f1ea;
            font-size: 12px;
            display: none;
        }
        #tuner.show { display: block; }
        #tuner h1 {
            margin: 0 0 8px 0;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--ui-mod);
        }
        #tuner h1 span { color: var(--ui-dim); font-size: 10px; }
        #tuner .tuner-row {
            display: flex;
            align-items: center;
            margin: 6px 0;
            line-height: 1.4;
        }
        #tuner .tuner-row label {
            flex: 1;
            margin-right: 8px;
        }
        #tuner .tuner-row output {
            flex: 1;
            text-align: center;
            color: #ffffff;
        }
        #tuner button {
            width: 32px;
            height: 28px;
            padding: 0;
            background: #54514a;
            border: 2px solid #33312c;
            box-shadow: 2px 2px 0 #050505;
            color: #f4f1ea;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        #tuner button:active { transform: translate(2px, 2px); box-shadow: none; }
        #tuner .tuner-toggle { width: 60px; }
        #tuner input[type="range"] {
            flex: 1;
            margin: 0 8px 0 0;
            min-width: 0;
        }
        #tuner-fade-secs-out { min-width: 30px; text-align: center; }
        #tuner input[type="range"] { flex: 1; margin: 0 8px 0 0; min-width: 0; }
        #tuner #tuner-fade-secs-out { flex: initial; min-width: 36px; text-align: right; }
        /* Portrait themes swap the dropdowns for an in-page picker: CEF paints
           native <select> popups to a separate texture OBS never composites, so
           everything here is plain DOM. */
        #tuner.wide { width: 440px; }
        #tuner .portrait-picker {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 6px 0;
        }
        #tuner .portrait-users {
            width: 190px;
            max-height: 240px;
            overflow-y: auto;
            overflow-x: hidden;
            background: #1e1b16;
            border: 2px solid #33312c;
        }
        #tuner .portrait-user {
            display: block;
            width: 100%;
            height: auto;
            padding: 3px 5px;
            background: transparent;
            border: 0;
            border-bottom: 1px solid #2a2722;
            box-shadow: none;
            color: #f4f1ea;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }
        #tuner .portrait-user:last-child { border-bottom: 0; }
        #tuner .portrait-user:hover { background: #2a2722; }
        #tuner .portrait-user.active { background: #54514a; color: #ffffff; }
        #tuner .portrait-user .pu-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #tuner .portrait-user .pu-assign {
            display: block;
            color: var(--ui-dim);
            font-size: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #tuner .portrait-user.active .pu-assign { color: #d8d2c4; }
        #tuner .portrait-grid-wrap { flex: 1; min-width: 0; }
        #tuner .portrait-grid-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        #tuner .portrait-grid-head .pg-title {
            color: var(--ui-dim);
            font-size: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #tuner .portrait-grid {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            gap: 4px;
            max-height: 220px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 3px;
            background: #1e1b16;
            border: 2px solid #33312c;
        }
        #tuner .portrait-tile {
            position: relative;
            display: block;
            box-sizing: border-box;
            width: 52px;
            height: 62px;
            padding: 0;
            background: #33312c;
            border: 2px solid #33312c;
            box-shadow: none;
            cursor: pointer;
        }
        #tuner .portrait-tile:active { transform: none; box-shadow: none; }
        #tuner .portrait-tile:hover { border-color: #8b8578; }
        #tuner .portrait-tile.selected { border-color: #f0c040; }
        /* Square-portrait themes (pmd) fit a square thumb, so the cell hugs it. */
        #tuner .portrait-grid.square .portrait-tile { height: 52px; }
        #tuner .portrait-tile.selected::after {
            content: "";
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 6px;
            height: 6px;
            background: #f0c040;
        }
        #tuner .portrait-tile canvas {
            display: block;
            image-rendering: pixelated;
        }
        #tuner .portrait-tile .tile-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 1px 0;
            background: rgba(5, 5, 5, 0.75);
            color: #f4f1ea;
            font-size: 9px;
            line-height: 1.1;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* AUTO / NONE fill the same footprint as a portrait tile, so their label
           centres rather than hugging the bottom edge. */
        #tuner .portrait-tile.plain {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #tuner .portrait-tile.plain .tile-label {
            position: static;
            padding: 0 2px;
            background: none;
            font-size: 11px;
            line-height: 1.2;
        }
        /* Generation pager under the grid: mirrors the tuner-row ◀ ▶ controls. */
        #tuner .portrait-gen-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }
        #tuner .portrait-gen-row .pg-gen {
            flex: 1;
            text-align: center;
            color: #ffffff;
            font-size: 12px;
        }

    <script>
    var chat = document.querySelector("#chat>ul");

    function escapeHtml(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    var PIXEL_SCALE = 2;
    var POP_MS = 180;
    var GLYPH_H = 12;

    function glyphHeight() {
        var d = currentTheme && currentTheme.data && currentTheme.data.default;
        return (d && d.h) || GLYPH_H;
    }

    /* True when the theme renders text with a woff2 webfont instead of atlas glyphs. */
    function usesWebfont() {
        return !!(currentTheme && currentTheme.fontFamily);
    }

    /* True when a webfont theme fills the webfont's gaps from its own atlas PNG.
       Such a theme lists the characters the webfont lacks in `atlasFallback`;
       pure-atlas themes omit the key and keep using the atlas for everything. */
    function usesAtlasFallback() {
        return !!(currentTheme && currentTheme.atlasFallback);
    }

    /* Should this character be drawn from the atlas rather than set as text?
       Single source of truth for the message body and the name/timestamp runs. */
    function useAtlasGlyph(ch) {
        if (!atlasReady()) return false;
        if (!GLYPHS[ch.charCodeAt(0)]) return false;
        if (!usesWebfont()) return true;
        return usesAtlasFallback() && currentTheme.atlasFallback.indexOf(ch) >= 0;
    }

    /* A theme webfont is generated from its own atlas PNG on a doubled pixel
       grid, so a glyph borrowed from that atlas must be drawn at PIXEL_SCALE to
       line up with the webfont text beside it. Verified against MinishType:
       unitsPerEm 1024, sCapHeight 1408 -> 22px caps at font-size 16, matching
       the atlas's 11px of cap ink doubled; all 56 letters and digits also match
       on advance width once doubled. */
    var GLYPHS = {};
    var WINDOW_STYLES = [];
    var PORTRAITS = [];
    var atlas = null;
    var boxImg = null;
    var iconImg = null;
    var portraitImg = null;
    var atlasCache = {};
    var boxCache = {};
    var iconCache = {};
    var portraitCache = {};
    var themeLoaded = false;
    var currentTheme = null;
    var chatHistory = [];
    var MAX_HISTORY = 30;
    var userPortraits = {};
    var PORTRAIT_STORE_KEY = "chatOverlayUserPortraits";

    function saveUserPortraits() {
        try {
            localStorage.setItem(PORTRAIT_STORE_KEY, JSON.stringify(userPortraits));
        } catch (e) {}
    }

    function loadUserPortraits() {
        try {
            var raw = localStorage.getItem(PORTRAIT_STORE_KEY);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
                Object.keys(parsed).forEach(function (tk) {
                    var m = parsed[tk];
                    if (m && typeof m === "object") {
                        userPortraits[tk] = userPortraits[tk] || {};
                        Object.keys(m).forEach(function (uk) {
                            if (typeof m[uk] === "string") userPortraits[tk][uk] = m[uk];
                        });
                    }
                });
            }
        } catch (e) {}
    }

    function userPortraitMap() {
        if (!currentTheme) return {};
        if (!userPortraits[currentTheme.key]) userPortraits[currentTheme.key] = {};
        return userPortraits[currentTheme.key];
    }

    /* ---- Tuner config persistence (localStorage, per channel) ----
       The overlay is a static browser source, so localStorage is the only place
       to remember settings between sessions. Config is keyed by the ?channel=
       value so two streamers sharing a machine don't clobber each other. */
    var CONFIG_STORE_KEY = "chatOverlayConfig";
    var CONFIG_VERSION = 1;
    var configStore = null;
    var configSaveTimer = null;

    function configChannelKey() {
        return channelName ? channelName.toLowerCase() : "_default";
    }

    function loadConfigStore() {
        configStore = null;
        try {
            var raw = localStorage.getItem(CONFIG_STORE_KEY);
            var parsed = raw ? JSON.parse(raw) : null;
            if (parsed && typeof parsed === "object" &&
                parsed.version === CONFIG_VERSION && parsed.channels &&
                typeof parsed.channels === "object") {
                configStore = parsed;
            }
        } catch (e) {}
        if (!configStore) configStore = { version: CONFIG_VERSION, channels: {} };
    }

    function currentConfig() {
        if (!configStore) loadConfigStore();
        var k = configChannelKey();
        if (!configStore.channels[k] || typeof configStore.channels[k] !== "object") {
            configStore.channels[k] = {};
        }
        return configStore.channels[k];
    }

    function saveConfig() {
        try {
            localStorage.setItem(CONFIG_STORE_KEY, JSON.stringify(configStore));
        } catch (e) {}
    }

    function scheduleConfigSave() {
        if (configSaveTimer) clearTimeout(configSaveTimer);
        configSaveTimer = setTimeout(saveConfig, 300);
    }

    /* Restores theme + appearance toggles + per-theme options for this channel.
       Runs once at startup, before the first applyTheme. Invalid/absent data
       silently falls back to the current in-code defaults. */
    function hydrateConfig() {
        loadConfigStore();
        var c = currentConfig();
        if (typeof c.theme === "string" && THEME_ORDER.indexOf(c.theme) !== -1) {
            themeIndex = THEME_ORDER.indexOf(c.theme);
        }
        var t = c.toggles;
        if (t && typeof t === "object") {
            if (typeof t.mode === "number" && t.mode >= 0 && t.mode < TUNER_MODES.length) tunerMode = t.mode;
            if (typeof t.dim === "boolean") dimOn = t.dim;
            if (typeof t.roleBadges === "boolean") roleBadgesOn = t.roleBadges;
            if (typeof t.badges === "boolean") badgesOn = t.badges;
            if (typeof t.timestamps === "boolean") timestampsOn = t.timestamps;
            if (typeof t.bg === "boolean") bgOn = t.bg;
            if (typeof t.fade === "boolean") fadeOn = t.fade;
            if (typeof t.fadeSeconds === "number") {
                fadeSeconds = Math.min(120, Math.max(5, t.fadeSeconds));
            }
        }
        if (!c.themeOptions || typeof c.themeOptions !== "object") c.themeOptions = {};
        themeOptionPersist = c.themeOptions;
    }

    function writeTogglesToConfig() {
        currentConfig().toggles = {
            mode: tunerMode,
            dim: dimOn,
            roleBadges: roleBadgesOn,
            badges: badgesOn,
            timestamps: timestampsOn,
            bg: bgOn,
            fade: fadeOn,
            fadeSeconds: fadeSeconds
        };
    }

    function persistToggles() {
        writeTogglesToConfig();
        saveConfig();
    }

    function persistThemeSelection() {
        currentConfig().theme = THEME_ORDER[themeIndex];
        saveConfig();
    }

    function stripShinyName(value) {
        value = value == null ? "" : String(value);

            var eh = nh - slices.t - slices.b;

            function drawTiledH(sx, sy, sw2, sh, dx, dy, dw, dh) {

                for (var x = dx; x < dx + dw; x += tw) {

                    ctx.drawImage(img, sx, sy, sw2, sh, dx, y, dw, dh2);

            ctx.drawImage(img, nw - slices.r, 0, slices.r, slices.t, w - dr, 0, dr, dt);
            ctx.drawImage(img, 0, nh - slices.b, slices.l, slices.b, 0, h - db, dl, db);
            ctx.drawImage(img, nw - slices.r, nh - slices.b, slices.r, slices.b, w - dr, h - db, dr, db);
            drawTiledH(slices.l, 0, ew, slices.t, dl, 0, iw, dt);
            drawTiledH(slices.l, nh - slices.b, ew, slices.b, dl, h - db, iw, db);
            drawTiledV(0, slices.t, slices.l, eh, 0, dt, dl, ih);
            drawTiledV(nw - slices.r, slices.t, slices.r, eh, w - dr, dt, dr, ih);

    function badgeImages(userBadges) {

        if (!userBadges) return html;
        var roleSets = { broadcaster: 1, moderator: 1, subscriber: 1, vip: 1 };
        Object.keys(userBadges).forEach(function (setId) {
            var url = badges[setId + "/" + userBadges[setId]];
            if (!url && setId === "subscriber") url = badgeSubFallback;
            if (url) html += "<img class=\"badge " + (roleSets[setId] ? "badge-role" : "badge-other") +
                "\" src=\"" + url + "\" alt=\"\">";
        });
        return html;
    }

    function resolveBadgeHtml(extra, flags) {
        var candidates = [
            extra.userBadges,
            extra.badgeInfo,
            flags && flags.badges,
            extra.userBadgesRaw
        ];
        for (var i = 0; i < candidates.length; i++) {
            if (!candidates[i]) continue;
            var h = badgeImages(candidates[i]);
            if (h) return h;
        }
        return "";
    }

    loadGlobalBadges();

    loadSevenTvGlobal();

    loadBttvGlobal();

    function emoteImg(url) {
        return "<img class=\"emote\" src=\"" + url +
            "\" alt=\"\" onerror=\"this.remove();\">";
    }

    function applyUnit(blockquote, state, unit) {
        if (unit.mod) {
            var emotes = blockquote.querySelectorAll("img.emote:not(.overlay)");
            if (emotes.length) {
                var el = emotes[emotes.length - 1];
                el.classList.add(unit.mod);
            }
        } else if (unit.glyph) {
            if (!state.lastCanvas || state.lastCanvas.parentNode !== blockquote ||
                blockquote.lastChild !== state.lastCanvas) {
                state.lastCanvas = document.createElement("canvas");
                state.lastCanvas.className = "glyph-canvas";
                state.lastCanvas._txt = "";
                blockquote.appendChild(state.lastCanvas);
            }
            state.lastCanvas._txt += unit.glyph;
            drawTextOnCanvas(state.lastCanvas, state.lastCanvas._txt, unit.row);
        } else {
            blockquote.insertAdjacentHTML("beforeend", unit.html);
            state.lastCanvas = null;
        }
        applyOverlays(blockquote);
    }

    function typeMessage(blockquote, units) {
        var state = { lastCanvas: null };
        var done = 0;
        var timer = setInterval(function () {
            if (done >= units.length) {
                clearInterval(timer);
                return;
            }
            applyUnit(blockquote, state, units[done]);
            done++;
        }, 25);
    }

    function renderAll(blockquote, units) {
        var state = { lastCanvas: null };
        for (var i = 0; i < units.length; i++) applyUnit(blockquote, state, units[i]);
    }

    function applyOverlays(blockquote) {
        blockquote.querySelectorAll("img.overlay").forEach(function (img) {
            if (img.closest(".e-stack")) return;
            var node = img.previousSibling;
            var base = null;
            while (node && node !== blockquote) {
                if (node.nodeType === 3) {
                    if (!/\S/.test(node.nodeValue.replace(/\u200b/g, ""))) {
                        node = node.previousSibling;
                        continue;
                    }
                    break;
                }
                if (node.nodeType === 1) {
                    if (node.classList.contains("emote")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("e-stack")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("glyph-canvas") &&
                        node._txt && !/\S/.test(node._txt)) {
                        node = node.previousSibling;
                        continue;
                    }
                }
                break;
            }
            if (!base) return;
            var stack;
            if (base.classList && base.classList.contains("e-stack")) {
                stack = base;
            } else {
                stack = document.createElement("span");
                stack.className = "e-stack";
                base.parentNode.replaceChild(stack, base);
                stack.appendChild(base);
            }
            stack.appendChild(img);
        });
    }

    function parseTwitchRanges(messageEmotes) {
        var parsed = {};
        if (typeof messageEmotes === "string") {
            messageEmotes.split("/").forEach(function (group) {
                if (!group) return;
                var colon = group.indexOf(":");
                var id = group.slice(0, colon);
                var ranges = group.slice(colon + 1).split(",");
                parsed[id] = ranges.map(function (r) {
                    var dash = r.indexOf("-");
                    return [r.slice(0, dash), r.slice(dash + 1)];
                });
            });
        } else if (messageEmotes && typeof messageEmotes === "object") {
            parsed = messageEmotes;
        }
        var ranges = [];
        Object.keys(parsed).forEach(function (emoteId) {
            parsed[emoteId].forEach(function (r) {
                var start, end;
                if (typeof r === "string") {
                    var dash = r.indexOf("-");
                    start = parseInt(r.slice(0, dash), 10);
                    end = parseInt(r.slice(dash + 1), 10);
                } else {
                    start = parseInt(r[0], 10);
                    end = parseInt(r[1], 10);
                }
                ranges.push({ id: emoteId, start: start, end: end });
            });
        });
        ranges.sort(function (a, b) { return a.start - b.start; });
        return ranges;
    }

    function twitchEmoteUnit(range) {
        var url = "https://static-cdn.jtvnw.net/emoticons/v2/" +
            range.id + "/default/dark/3.0";
        return emoteImg(url);
    }

    function buildUnits(message, messageEmotes) {
        /* A theme can mix a webfont with atlas glyphs: mc renders letters as webfont
           text but its atlasFallback characters as canvases, so it must use the same
           unit builder as the pure-atlas themes. Other webfont themes still bail out,
           since buildUnits would also start curly-quoting their text (buildDefaultUnits
           only does that when the theme sets mapApostrophe). */
        if (!currentTheme.atlas || (usesWebfont() && !usesAtlasFallback())) return buildDefaultUnits(message, messageEmotes);
        var twitchRanges = parseTwitchRanges(messageEmotes);
        var units = [];
        var i = 0;

        function nearTwitchRange() {
            for (var k = 0; k < twitchRanges.length; k++) {
                if (twitchRanges[k].start === i) return twitchRanges[k];
            }
            return null;
        }

        while (i < message.length) {
            var range = nearTwitchRange();
            if (range) {
                units.push({ html: twitchEmoteUnit(range) });
                i = range.end + 1;
                continue;
            }
            if (/\s/.test(message[i])) {
                units.push(glyphOrTextUnit(message[i], 0));
                units.push({ html: "\u200b" });
                i++;
                continue;
            }
            var wordEnd = i;
            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {
                var r2 = null;
                for (var k2 = 0; k2 < twitchRanges.length; k2++) {
                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }
                if (r2) break;
                wordEnd++;
            }
            var word = message.slice(i, wordEnd);
            var overlay = false;
            var url = sevenTv[word];
            if (!url && sevenTvOverlay[word]) {
                url = sevenTvOverlay[word];
                overlay = true;
            }
            if (!url) {
                url = bttv[word];
                if (!url && bttvOverlay[word]) {
                    url = bttvOverlay[word];
                    overlay = true;
                }
            }
            if (!url) {
                var lead = 0;
                while (lead < word.length && /^[([{<]$/.test(word[lead])) lead++;
                var tail = 0;
                while (tail < word.length - lead && /^[!.,;:?)\]}>]$/.test(word[word.length - 1 - tail])) tail++;
                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push(glyphOrTextUnit(word[u], 0));
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push(glyphOrTextUnit(word[word.length - tail + u], 0));
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p = units.length - 1; p >= 0; p--) {
                    if (units[p].glyph) {
                        if (!/\S/.test(units[p].glyph)) continue;
                        prevEmote = false;
                        break;
                    }
                    var h = units[p].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h.replace(/\u200b/g, ""))) continue;
                    prevEmote = /<img /.test(h);
                    break;
                }
                if (prevEmote) {
                    units.push({ mod: fx });
                    i = wordEnd;
                    continue;
                }
            }
            if (url) {
                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;
                continue;
            }
            var wrap = 0;
            for (var c = i; c < wordEnd; c++) {
                units.push(glyphOrTextUnit(resolveQuote(message[c], message, c), 0));
                if (c < wordEnd - 1 && ++wrap >= 26) { units.push({ html: "\u200b" }); wrap = 0; }
            }
            i = wordEnd;
        }
        return units;
    }

    function buildDefaultUnits(message, messageEmotes) {
        var twitchRanges = parseTwitchRanges(messageEmotes);
        var units = [];
        var i = 0;

        function nearTwitchRange() {
            for (var k = 0; k < twitchRanges.length; k++) {
                if (twitchRanges[k].start === i) return twitchRanges[k];
            }
            return null;
        }

        while (i < message.length) {
            var range = nearTwitchRange();
            if (range) {
                units.push({ html: twitchEmoteUnit(range) });
                i = range.end + 1;
                continue;
            }
            var ch = message[i];
            if (/\s/.test(ch)) {
                units.push({ html: escapeHtml(ch) });
                i++;
                continue;
            }
            var wordEnd = i;
            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {
                var r2 = null;
                for (var k2 = 0; k2 < twitchRanges.length; k2++) {
                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }
                if (r2) break;
                wordEnd++;
            }
            var word = message.slice(i, wordEnd);
            var overlay = false;
            var url = sevenTv[word];
            if (!url && sevenTvOverlay[word]) {
                url = sevenTvOverlay[word];
                overlay = true;
            }
            if (!url) {
                url = bttv[word];
                if (!url && bttvOverlay[word]) {
                    url = bttvOverlay[word];
                    overlay = true;
                }
            }
            if (!url) {
                var lead = 0;
                while (lead < word.length && /^[([{<]$/.test(word[lead])) lead++;
                var tail = 0;
                while (tail < word.length - lead && /^[!.,;:?)\]}>]$/.test(word[word.length - 1 - tail])) tail++;
                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push({ html: escapeHtml(word[u]) });
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push({ html: escapeHtml(word[word.length - tail + u]) });
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p2 = units.length - 1; p2 >= 0; p2--) {
                    var h = units[p2].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h)) continue;
                    prevEmote = /<img /.test(h);
                    break;
                }
                if (prevEmote) {
                    units.push({ mod: fx });
                    i = wordEnd;
                    continue;
                }
            }
            if (url) {
                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;
                continue;
            }
            for (var c = i; c < wordEnd; c++) {
                var ch = message[c];
                if (currentTheme && currentTheme.mapApostrophe) ch = resolveQuote(ch, message, c);
                units.push({ html: escapeHtml(ch) });
            }
            i = wordEnd;
        }
        return units;
    }

    function dropOldestMessage() {
        var rec = chatHistory[0];
        if (!rec) return;
        var node = rec.node;
        if (node && node.parentNode) node.parentNode.removeChild(node);
        chatHistory.shift();
    }

    function appendMessage(record) {
        chatHistory.push(record);
        renderMessage(record, true);
        syncPortraitUsers();
        while (chatHistory.length > MAX_HISTORY) dropOldestMessage();
    }

    function renderMessage(record, animate) {
        var newMessage = buildMessageNode(record);
        record.node = newMessage;
        chat.append(newMessage);
        if (newMessage._finish) newMessage._finish(animate);
    }

    function nameRowFor(flags) {
        if (currentTheme.nameRow != null) return currentTheme.nameRow;
        var rows = currentTheme.userRows;
        if (rows && rows.broadcaster != null) {
            if (flags.broadcaster) return rows.broadcaster;
            if (flags.mod) return rows.mod;
            if (flags.vip) return rows.vip;
            if (flags.subscriber) return rows.sub;
        }
        return 0;
    }

    function buildNamePrefix(record, nameRow) {
        var prefix = [];
        var bhtml = resolveBadgeHtml(record.extra, record.flags);
        if (bhtml) prefix.push({ html: bhtml });
        var user = record.user;
        var i;
        if (usesWebfont()) {
            var f = record.flags || {};
            var role = f.broadcaster ? " broadcaster" : f.mod ? " mod" : f.vip ? " vip" : f.subscriber ? " sub" : "";
            prefix.push({ html: '<span class="user' + role + '">' + escapeHtml(user) + "</span>" });
        } else {
            for (i = 0; i < user.length; i++) prefix.push(glyphOrTextUnit(user[i], nameRow));
        }
        if (timestampsOn) {
            var now = new Date(record.ts || Date.now());
            var hh = String(now.getHours()).padStart(2, "0");
            var mm = String(now.getMinutes()).padStart(2, "0");
            var tsText = " (" + hh + ":" + mm + ")";
            for (i = 0; i < tsText.length; i++) prefix.push(glyphOrTextUnit(tsText[i], nameRow));
        }
        var suffix = ": ";
        for (i = 0; i < suffix.length; i++) prefix.push(glyphOrTextUnit(suffix[i], nameRow));
        prefix.push({ html: "\u200b" });
        return prefix;
    }

    function fitNameTag(tag, style, cssWidth) {
        var ctx = tag.getContext("2d");
        var minW = style.w * PIXEL_SCALE;
        tag.width = Math.max(minW, cssWidth);
        tag.height = style.h * PIXEL_SCALE;
        ctx.clearRect(0, 0, tag.width, tag.height);
        if (!atlasReady()) return;
        ctx.imageSmoothingEnabled = false;
        var L = 20, R = 10;
        var sh = style.h;
        var leftW = L * PIXEL_SCALE;
        var rightW = R * PIXEL_SCALE;
        var stretch = tag.width - leftW - rightW;
        ctx.drawImage(atlas, style.x, style.y, L, sh, 0, 0, leftW, tag.height);
        ctx.drawImage(atlas, style.x + L, style.y, style.w - L - R, sh, leftW, 0, stretch, tag.height);
        ctx.drawImage(atlas, style.x + style.w - R, style.y, R, sh, tag.width - rightW, 0, rightW, tag.height);
    }

    function buildMessageNode(record) {
        var user = record.user, message = record.message, flags = record.flags, extra = record.extra;
        var useAtlas = !!(currentTheme.atlas || currentTheme.boxAtlas);
        var newMessage = document.createElement("li");
        var blockquote = document.createElement("blockquote");
        var units = buildUnits(message, extra && extra.messageEmotes);

        if (!useAtlas) {
            var username = document.createElement("span");
            var timestamp = document.createElement("span");
            username.className = "user";
            if (flags.mod) username.classList.add("mod");
            if (flags.subscriber) username.classList.add("sub");
            if (flags.vip) username.classList.add("vip");
            username.innerHTML = resolveBadgeHtml(extra, flags) + escapeHtml(user) + ":";
            var now = new Date(record.ts || Date.now());
            var hh = String(now.getHours()).padStart(2, "0");
            var mm = String(now.getMinutes()).padStart(2, "0");
            timestamp.className = "timestamp";
            timestamp.innerText = hh + ":" + mm;
            blockquote.innerHTML = "";
            var content = document.createElement("div");
            content.className = "msg-content";
            content.append(username, timestamp, blockquote);
            newMessage.appendChild(content);
            newMessage._finish = function (animate) {
                if (animate) typeMessage(blockquote, units);
                else renderAll(blockquote, units);
            };
            return newMessage;
        }

        var box = document.createElement("div");
        var bg = document.createElement("canvas");
        var windowStyle = currentWindowStyle();
        var nameTagEl = null;
        var nameTagStyle = null;
        var msgPortrait = null;
        var boxStyleName = effectiveBoxStyleName(record);
        var boxStyleImages = boxStyleName ? boxStyleImage(boxStyleName) : null;

        box.className = "msg-box";
        bg.className = "window-bg";

        blockquote.className = "message-text";
        blockquote.innerHTML = "";

        if (currentTheme.inlineName) {
            units = buildNamePrefix(record, nameRowFor(flags)).concat(units);
        } else {
            var header = document.createElement("div");
            var username = document.createElement("span");
            header.className = "msg-header";
            username.className = "user username";
            var nameRow = nameRowFor(flags);

            buildTextRuns(username, user, nameRow);

            var badgesHtml = resolveBadgeHtml(extra, flags);
            if (badgesHtml) username.insertAdjacentHTML("afterbegin", badgesHtml);

            if (currentTheme.nameTag) {
                var ncVals = THEME_TUNER.nameColor.resolveValues();
                var ncIdx = themeOptionState["nameColor"];
                var ncStyle = null;
                if (typeof ncIdx === "number" && ncIdx >= 0 && ncVals[ncIdx]) ncStyle = ncVals[ncIdx].value;
                if (!ncStyle) {
                    var ncDecl = currentTheme.data && currentTheme.data.overlays &&
                        currentTheme.data.overlays.name_color;
                    if (ncDecl && ncDecl.options && ncDecl.default) ncStyle = ncDecl.options[ncDecl.default];
                }
                if (ncStyle) {
                    var tag = document.createElement("canvas");
                    tag.className = "name-tag";
                    tag.width = ncStyle.w * PIXEL_SCALE;
                    tag.height = ncStyle.h * PIXEL_SCALE;
                    nameTagEl = tag;
                    nameTagStyle = ncStyle;
                    header.appendChild(tag);
                }
            }

            header.appendChild(username);

            if (timestampsOn) {
                var ts = document.createElement("span");
                ts.className = "timestamp";
                var now2 = new Date(record.ts || Date.now());
                var hh2 = String(now2.getHours()).padStart(2, "0");
                var mm2 = String(now2.getMinutes()).padStart(2, "0");
                buildTextRuns(ts, hh2 + ":" + mm2, 0);
                header.appendChild(ts);
            }

            box.appendChild(header);
        }

        if (currentTheme.portrait && PORTRAITS.length) {
            var portrait = null;
            var portraitShiny = false;
            var userKey = String(record.user || "").toLowerCase();
            var assignedName = userKey ? userPortraitMap()[userKey] : "";
            if (assignedName === "__hidden__") {
                record._portraitName = "__hidden__";
            } else {
                if (assignedName) {
                    var assignedBase = stripShinyName(assignedName);
                    for (var pi = 0; pi < PORTRAITS.length; pi++) {
                        if (PORTRAITS[pi].name === assignedBase) { portrait = PORTRAITS[pi]; break; }
                    }
                    if (portrait) portraitShiny = isShinyName(assignedName);
                }
                if (!portrait && record._portraitName && record._portraitName !== "__hidden__") {
                    var prevBase = stripShinyName(record._portraitName);
                    for (var pi = 0; pi < PORTRAITS.length; pi++) {
                        if (PORTRAITS[pi].name === prevBase) { portrait = PORTRAITS[pi]; break; }
                    }
                    if (portrait) portraitShiny = isShinyName(record._portraitName);
                }
                if (!portrait) {
                    portraitShiny = false;
                    if (userKey) {
                        /* Dedupe on the base name so a shiny and a normal of the
                           same species can never both be handed out. */
                        var used = {};
                        Object.keys(userPortraitMap()).forEach(function (u) {
                            var n = stripShinyName(userPortraitMap()[u]);
                            if (n && n !== "none" && n !== "__hidden__") used[n] = true;
                        });
                        var pool = [];
                        for (var pi = 0; pi < PORTRAITS.length; pi++) {
                            var pc = PORTRAITS[pi];
                            if (pc.name !== "none" && !used[pc.name]) pool.push(pc);
                        }
                        portrait = pool.length ? pool[Math.floor(Math.random() * pool.length)] : PORTRAITS[Math.floor(Math.random() * PORTRAITS.length)];
                        if (portrait.name !== "none") {
                            portraitShiny = !!(portrait.shinySrc && Math.random() < SHINY_CHANCE);
                            userPortraitMap()[userKey] = portrait.name + (portraitShiny ? SHINY_SUFFIX : "");
                            saveUserPortraits();
                        }
                    } else {
                        portrait = PORTRAITS[Math.floor(Math.random() * PORTRAITS.length)];
                    }
                }
                record._portraitName = portrait.name + (portraitShiny ? SHINY_SUFFIX : "");
                if (currentTheme.iconBoxPortrait) {
                    msgPortrait = (portraitShiny && portrait.shinySrc) ?
                        { name: portrait.name, src: portrait.shinySrc, w: portrait.w, h: portrait.h } :
                        portrait;
                } else {
                    var pic = document.createElement("canvas");
                    pic.className = "portrait";
                    drawPortrait(portrait, pic, PIXEL_SCALE);
                    box.appendChild(pic);
                }
            }
        }

        box.appendChild(blockquote);
        if (record._portraitName !== "__hidden__" &&
            portraitImg && (iconImg || (boxStyleImages && boxStyleImages.icon))) {
            var iconEl = document.createElement("canvas");
            iconEl.className = "icon-box";
            drawIconBox(iconEl, boxStyleImages ? boxStyleImages.icon : null, msgPortrait);
            newMessage.appendChild(iconEl);
        }
        newMessage.appendChild(bg);
        newMessage.appendChild(box);

        var arrowFrames = continueArrowFrames();
        if (arrowFrames.length) {
            var arr = document.createElement("canvas");
            arr.className = "continue-arrow";
            arr.width = arrowFrames[0].w * PIXEL_SCALE;
            arr.height = arrowFrames[0].h * PIXEL_SCALE;
            arr._frames = arrowFrames;
            arr._frame = 0;
            drawArrowFrame(arr, arrowFrames[0]);
            newMessage.appendChild(arr);
        }

        function sizeWindow() {
            if (blockquote.offsetWidth) blockquote.style.minWidth = blockquote.offsetWidth + "px";
            if (blockquote.offsetHeight) blockquote.style.minHeight = blockquote.offsetHeight + "px";
            if (windowStyle && box.offsetWidth && box.offsetHeight) {
                bg.style.left = box.offsetLeft + "px";
                bg.style.top = box.offsetTop + "px";
                bg.width = box.offsetWidth;
                bg.height = box.offsetHeight;
                drawWindow(bg, windowStyle, bg.width, bg.height,
                    boxStyleImages ? boxStyleImages.box : null);
            }
            if (nameTagEl && nameTagStyle && username && username.offsetWidth) {
                var target = (username.offsetLeft - nameTagEl.offsetLeft) + username.offsetWidth +
                     (username.offsetLeft - nameTagEl.offsetLeft);
                fitNameTag(nameTagEl, nameTagStyle, target);
                nameTagEl.style.width = nameTagEl.width + "px";
            }
        }

        function finishMessage() {
            blockquote.innerHTML = "";
            setTimeout(function () { typeMessage(blockquote, units); }, POP_MS);
        }

        function emotesReady() {
            var imgs = blockquote.querySelectorAll("img");
            for (var i = 0; i < imgs.length; i++) {
                if (!imgs[i].complete) return false;
            }
            return true;
        }

        function run(animate) {
            renderAll(blockquote, units);
            sizeWindow();
            if (!animate) return;
            if (emotesReady()) {
                finishMessage();
            } else {
                var waited = 0;
                var waiter = setInterval(function () {
                    waited += 25;
                    if (emotesReady() || waited >= 3000) {
                        clearInterval(waiter);
                        sizeWindow();
                        finishMessage();
                    }
                }, 25);
            }
        }

        blockquote.addEventListener("load", function (e) {
            if (e.target && e.target.tagName === "IMG") sizeWindow();
        }, true);
        blockquote.addEventListener("error", function (e) {
            if (e.target && e.target.tagName === "IMG") sizeWindow();
        }, true);

        newMessage._finish = function (animate) { run(animate); };
        return newMessage;
    }

    function humanizeName(name) {

    function boxStyleImage(name) {

    function effectiveBoxStyleName(record) {
        if (!currentTheme || !currentTheme.boxStyles) return null;
        var name = boxStyleSelectionName();
        if (name === "random") {
            if (record._boxStyleName) return record._boxStyleName;
            var keys = Object.keys(currentTheme.boxStyles);
            var pool = (keys.length > 1 && lastRandomBoxStyleName) ?
                keys.filter(function (k) { return k !== lastRandomBoxStyleName; }) : keys;
            name = pool[Math.floor(Math.random() * pool.length)];
            record._boxStyleName = name;

    /* File-portrait themes (pmd) load their PNGs on demand; repaint the picker and
       the chat once loading settles so we don't re-render per image. */
    var portraitFileCache = {};
    var portraitRepaintTimer = null;

    function schedulePortraitRepaint() {
        if (!currentTheme || !currentTheme.portraitFiles) return;
        if (portraitRepaintTimer) clearTimeout(portraitRepaintTimer);
        portraitRepaintTimer = setTimeout(function () {
            portraitRepaintTimer = null;
            if (!currentTheme || !currentTheme.portraitFiles) return;
            paintPortraitThumbs();
            renderAllHistory();
        }, 50);
    }

    function filePortraitImage(src) {
        if (!portraitFileCache[src]) {
            var img = new Image();
            img.onload = function () { schedulePortraitRepaint(); };
            img.onerror = function () {};
            img.src = src;
            portraitFileCache[src] = img;
        }
        return portraitFileCache[src];
    }

    /* Paints one portrait into a canvas at the given scale. Callers size
       the canvas themselves so the tile grid can pre-measure at 1:1. */
    function drawPortrait(p, canvas, scale) {
        if (!p || !canvas) return false;
        var w = Math.round(p.w * scale);
        var h = Math.round(p.h * scale);
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        if (p.src) {
            var img = filePortraitImage(p.src);
            if (!img.complete || !img.naturalWidth) return false;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, 0, 0, w, h);
            return true;
        }
        if (!atlasReady()) return false;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(atlas, p.x, p.y, p.w, p.h, 0, 0, w, h);
        return true;
    }

    /* Draws the file-based portrait icon box left of the message box for themes
       that have no atlas (pmd): the frame PNG is downscaled to a fixed CSS size
       and the 40px portrait is painted 2x (80 css px), slightly inset. */
    var ICON_BOX_CSS = 96;
    var PORTRAIT_CSS = 80;

    function drawIconBox(canvas, iconOverride, portraitOverride) {
        if (!canvas) return false;
        canvas.width = ICON_BOX_CSS * PIXEL_SCALE;
        canvas.height = ICON_BOX_CSS * PIXEL_SCALE;
        canvas.style.width = ICON_BOX_CSS + "px";
        canvas.style.height = ICON_BOX_CSS + "px";
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var srcIcon = iconOverride || iconImg;
        if (!srcIcon || !srcIcon.complete || !srcIcon.naturalWidth) return false;
        ctx.imageSmoothingEnabled = false;
        var boxScale = (currentTheme.boxScale || 0.5) * PIXEL_SCALE;
        drawNineSlice(ctx, srcIcon, { l: 20, r: 20, t: 20, b: 20 }, boxScale,
            canvas.width, canvas.height);
        var pw = PORTRAIT_CSS * PIXEL_SCALE;
        var ph = PORTRAIT_CSS * PIXEL_SCALE;
        var px = Math.round((canvas.width - pw) / 2);
        var py = Math.round((canvas.height - ph) / 2);
        if (portraitOverride) {
            var pv = document.createElement("canvas");
            if (!drawPortrait(portraitOverride, pv, PIXEL_SCALE)) return false;
            ctx.drawImage(pv, px, py, pw, ph);
            return true;
        }
        if (!portraitImg || !portraitImg.complete || !portraitImg.naturalWidth) return false;
        ctx.drawImage(portraitImg, 0, 0, 40, 40, px, py, pw, ph);
        return true;
    }

    /* Tiles paint blank until the atlas finishes loading, so label the cell until
       the real pixels land. */
    function drawPortraitPlaceholder(canvas, p, scale) {
        scale = scale || 1;
        var w = Math.round(p.w * scale);
        var h = Math.round(p.h * scale);
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#33312c";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#8b8578";
        ctx.font = Math.round(10 * scale) + "px " +
            (currentTheme && currentTheme.fontFamily ? currentTheme.fontFamily : "monospace");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        var words = humanizeName(p.name).split(" ");
        var lines = words.length > 2 ? [words.slice(0, -1).join(" "), words[words.length - 1]] : words;
        for (var i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], w / 2, h / 2 + (i - (lines.length - 1) / 2) * 10 * scale);
        }
    }

    function knownChatters() {
        var seen = {};
        var list = [];
        for (var i = 0; i < chatHistory.length; i++) {
            var u = String(chatHistory[i].user || "").toLowerCase();
            if (u && !seen[u]) { seen[u] = true; list.push(chatHistory[i].user); }
        }
        list.sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
        return list;
    }

    var portraitUsersBox = null;
    var portraitGridBox = null;
    var portraitGenIndex = 0;
    var portraitGenLabel = null;
    var portraitGridTitle = null;
    var portraitRows = {};
    var portraitTiles = {};
    var selectedPortraitUser = "";

    /* Called by appendMessage on every message, so it must be incremental:
       appending only new chatters and rewriting nothing else. The grid itself is
       built once per theme and never rebuilt here. */
    function syncPortraitUsers() {
        if (!portraitUsersBox || !portraitUsersBox.parentNode) return;
        var users = knownChatters();
        var live = {};
        users.forEach(function (u) {
            var key = u.toLowerCase();
            live[key] = true;
            if (portraitRows[key]) return;
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "portrait-user";
            btn.dataset.user = u;
            var name = document.createElement("span");
            name.className = "pu-name";
            name.textContent = u;
            var assign = document.createElement("span");
            assign.className = "pu-assign";
            btn.appendChild(name);
            btn.appendChild(assign);
            btn.addEventListener("click", function () {
                selectedPortraitUser = u;
                updatePortraitSelection();
            });
            portraitUsersBox.appendChild(btn);
            portraitRows[key] = { btn: btn, assign: assign };
        });
        /* Drop chatters that have aged out of chatHistory. Their stored mapping
           is left alone so it comes back if they reappear, but offering them here
           would let you assign a portrait nothing can ever display. */
        for (var key in portraitRows) {
            if (!Object.prototype.hasOwnProperty.call(portraitRows, key) || live[key]) continue;
            var stale = portraitRows[key];
            if (stale.btn.parentNode) stale.btn.parentNode.removeChild(stale.btn);
            delete portraitRows[key];
        }
        if (selectedPortraitUser && !portraitRows[selectedPortraitUser.toLowerCase()]) {
            selectedPortraitUser = "";
        }
        if (!selectedPortraitUser && users.length) selectedPortraitUser = users[0];
        updatePortraitSelection();
    }

    function assignmentLabel(name) {
        if (!name || name === "__auto__") return "Auto (default)";
        if (name === "__hidden__" || name === "none") return "None";
        var label = humanizeName(stripShinyName(name));
        return isShinyName(name) ? label + " (Shiny)" : label;
    }

    /* Repaints every row's caption and moves the selected-state ring. Mutates
       existing nodes only, so it is safe to call per chat message. */
    function updatePortraitSelection() {
        if (!portraitUsersBox) return;
        var map = userPortraitMap();
        var sel = selectedPortraitUser.toLowerCase();
        var key;
        for (key in portraitRows) {
            if (!Object.prototype.hasOwnProperty.call(portraitRows, key)) continue;
            var row = portraitRows[key];
            var isActive = key === sel;
            if (isActive !== (row.btn.className.indexOf("active") !== -1)) {
                row.btn.className = isActive ? "portrait-user active" : "portrait-user";
            }
            row.assign.textContent = assignmentLabel(map[key]);
        }
        var current = sel ? (map[sel] || "__auto__") : "__auto__";
        /* Tiles only hold base portraits; a shiny assignment still highlights
           its base tile while the caption reports "(Shiny)". */
        var currentTileValue = (current === "__auto__" || current === "__hidden__") ?
            current : stripShinyName(current);
        for (key in portraitTiles) {
            if (!Object.prototype.hasOwnProperty.call(portraitTiles, key)) continue;
            var tile = portraitTiles[key];
            var on = !!selectedPortraitUser && tile.dataset.value === currentTileValue;
            if (on !== (tile.className.indexOf("selected") !== -1)) {
                tile.className = "portrait-tile" + (on ? " selected" : "");
            }
        }
        if (portraitGridTitle) {
            portraitGridTitle.textContent = selectedPortraitUser
                ? selectedPortraitUser + " — " + assignmentLabel(current)
                : "no chatter yet";
        }
    }

    function buildPortraitPicker() {
        var row = document.createElement("div");
        row.className = "portrait-picker";

        portraitUsersBox = document.createElement("div");
        portraitUsersBox.className = "portrait-users";
        row.appendChild(portraitUsersBox);

        var wrap = document.createElement("div");
        wrap.className = "portrait-grid-wrap";
        var head = document.createElement("div");
        head.className = "portrait-grid-head";
        portraitGridTitle = document.createElement("span");
        portraitGridTitle.className = "pg-title";
        head.appendChild(portraitGridTitle);
        var pager = document.createElement("span");
        var up = document.createElement("button");

        var down = document.createElement("button");
        down.type = "button";
        down.textContent = "▼";
        pager.appendChild(up);
        pager.appendChild(down);
        head.appendChild(pager);
        wrap.appendChild(head);

        portraitGridBox = document.createElement("div");
        portraitGridBox.className = "portrait-grid";
        wrap.appendChild(portraitGridBox);

        /* Gen paging (file-based themes): one generation per page keeps the grid
           readable; the arrows cycle with wrap-around and reset the scroll. */
        portraitGenIndex = 0;
        portraitGenLabel = null;
        if (currentTheme && currentTheme.portraitFiles && PMD_PORTRAIT_GENS && PMD_PORTRAIT_GENS.length > 1) {
            var genRow = document.createElement("div");
            genRow.className = "portrait-gen-row";
            var genPrev = document.createElement("button");
            genPrev.type = "button";
            genPrev.textContent = "◀";
            portraitGenLabel = document.createElement("span");
            portraitGenLabel.className = "pg-gen";
            var genNext = document.createElement("button");
            genNext.type = "button";
            genNext.textContent = "▶";
            genRow.appendChild(genPrev);
            genRow.appendChild(portraitGenLabel);
            genRow.appendChild(genNext);
            wrap.appendChild(genRow);
            var genCount = PMD_PORTRAIT_GENS.length;
            var stepGen = function (delta) {
                portraitGenIndex = (portraitGenIndex + delta + genCount) % genCount;
                portraitGridBox.scrollTop = 0;
                paintPortraitThumbs();
            };
            genPrev.addEventListener("click", function () { stepGen(-1); });
            genNext.addEventListener("click", function () { stepGen(1); });
        }

        row.appendChild(wrap);
        tunerOptionsBox.appendChild(row);

        /* Wheel scrolling over a scrollable div is not dependable across CEF
           builds, so page by row with buttons, which definitely work. */
        up.addEventListener("click", function () {
            portraitGridBox.scrollTop -= portraitGridBox.clientHeight / 3;
        });
        down.addEventListener("click", function () {
            portraitGridBox.scrollTop += portraitGridBox.clientHeight / 3;
        });

        portraitRows = {};
        portraitTiles = {};
        selectedPortraitUser = "";
        paintPortraitThumbs();
        syncPortraitUsers();
