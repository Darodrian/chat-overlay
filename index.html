    /* Tile metrics. The chat renders portraits in an 80x96 box for both portrait
       themes (see the .portrait rules), so thumbnails reuse that exact ratio and
       stay a WYSIWYG preview. TILE_W is the grid track; the 2px borders sit
       inside it, leaving TILE_INNER for the canvas. */
    var TILE_W = 52;
    var TILE_BORDER = 2;
    var TILE_INNER = TILE_W - TILE_BORDER * 2;
    var CHAT_W = 80;
    var CHAT_H = 96;

    /* Builds the AUTO / NONE / portrait tiles for the current theme. Runs on
       theme change and again when the atlas finishes loading, since tiles paint
       blank until atlasReady(). */
    function paintPortraitThumbs() {
        if (!portraitGridBox) return;
        portraitGridBox.style.gridTemplateColumns = "repeat(4, " + TILE_W + "px)";
        portraitGridBox.classList.toggle("square", !!(currentTheme && currentTheme.squarePortrait));
        portraitGridBox.innerHTML = "";
        portraitTiles = {};

        /* File-based themes page the deck by generation; atlas themes show their
           whole (small) list and never build a gen row. */
        var genFilter = (currentTheme && currentTheme.portraitFiles) ? portraitGenIndex + 1 : 0;
        if (portraitGenLabel && PMD_PORTRAIT_GENS) {
            portraitGenLabel.textContent = "Gen " + genFilter +
                " (" + genFilter + "/" + PMD_PORTRAIT_GENS.length + ")";
        }

        function addTile(value, label, painter) {
            var tile = document.createElement("button");
            tile.type = "button";
            tile.className = "portrait-tile";
            tile.dataset.value = value;
            tile.title = label;
            painter(tile);
            tile.addEventListener("click", function () {
                if (!selectedPortraitUser) return;
                if (value === "__auto__") clearUserPortrait(selectedPortraitUser);
                else setUserPortrait(selectedPortraitUser, value);
                updatePortraitSelection();
            });
            portraitGridBox.appendChild(tile);
            portraitTiles[value] = tile;
        }

        /* AUTO / NONE share the portrait tile footprint so the grid reads as one
           uniform matrix instead of two short stubs beside taller thumbnails. */
        function plainTile(tile, text) {
            tile.className += " plain";
            var span = document.createElement("span");
            span.className = "tile-label";
            span.textContent = text;
            tile.appendChild(span);
        }

        addTile("__auto__", "Auto (default)", function (tile) { plainTile(tile, "AUTO"); });
        addTile("__hidden__", "None (no portrait)", function (tile) { plainTile(tile, "NONE"); });

        PORTRAITS.forEach(function (p) {
            if (p.name === "none") return;
            if (genFilter && p.gen !== genFilter) return;
            addTile(p.name, humanizeName(p.name), function (tile) {
                var cv = document.createElement("canvas");
                /* Intrinsic pixels match chat exactly (PIXEL_SCALE); CSS below
                   scales the canvas into the tile box, which reproduces chat's
                   proportions (80:96 for atlas portrait themes, square for the
                   pmd icon-box portraits). */
                if (!drawPortrait(p, cv, PIXEL_SCALE)) drawPortraitPlaceholder(cv, p, PIXEL_SCALE);
                cv.style.width = TILE_INNER + "px";
                cv.style.height = (TILE_INNER *
                    (currentTheme && currentTheme.squarePortrait ? 1 : CHAT_H / CHAT_W)) + "px";
                tile.appendChild(cv);
            });
        });
        updatePortraitSelection();
    }

    function applyTunerClass() {

    function syncExpireTimer() {
        if (fadeOn && !expireTimer) {
            expireTimer = setInterval(expireLoop, 250);
        } else if (!fadeOn && expireTimer) {
            clearInterval(expireTimer);
            expireTimer = null;
        }
    }

    function expireLoop() {
        var limit = fadeSeconds * 1000;
        var now = Date.now();
        for (var i = chatHistory.length - 1; i >= 0; i--) {
            if (now - (chatHistory[i].ts || now) >= limit) {
                expireMessage(chatHistory[i]);
            }
        }
    }

    function expireMessage(record) {
        if (record.expiring) return;
        record.expiring = true;
        var node = record.node;
        if (node) {
            node.classList.add("expiring");
            setTimeout(function () {
                if (node.parentNode) node.parentNode.removeChild(node);
            }, FADE_MS);
        }
        var i = chatHistory.indexOf(record);
        if (i >= 0) chatHistory.splice(i, 1);
    }

    document.getElementById("theme-prev").addEventListener("click", function () {
        themeIndex = (themeIndex + THEME_ORDER.length - 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
        persistThemeSelection();
    });

    document.getElementById("theme-next").addEventListener("click", function () {
        themeIndex = (themeIndex + 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
        persistThemeSelection();
    });

    document.getElementById("tuner-prev").addEventListener("click", function () {
        tunerMode = (tunerMode + TUNER_MODES.length - 1) % TUNER_MODES.length;
        applyTunerMode();
        persistToggles();
    });

    document.getElementById("tuner-next").addEventListener("click", function () {
        tunerMode = (tunerMode + 1) % TUNER_MODES.length;
        applyTunerMode();
        persistToggles();
    });

    dimBtn.addEventListener("click", function () {
        dimOn = !dimOn;
        applyDim();
        persistToggles();
    });

    badgesBtn.addEventListener("click", function () {
        badgesOn = !badgesOn;
        applyBadges();
        persistToggles();
    });

    roleBadgesBtn.addEventListener("click", function () {
        roleBadgesOn = !roleBadgesOn;
        applyRoleBadges();
        persistToggles();
    });

    timestampsBtn.addEventListener("click", function () {
        timestampsOn = !timestampsOn;
        applyTimestamps();
        persistToggles();
    });

    bgBtn.addEventListener("click", function () {
        bgOn = !bgOn;
        applyBg();
        persistToggles();
    });

    fadeBtn.addEventListener("click", function () {
        fadeOn = !fadeOn;
        applyFade();
        persistToggles();
    });

    fadeSecsInput.addEventListener("input", function () {
        fadeSeconds = parseInt(fadeSecsInput.value, 10) || 30;
        applyFadeSeconds();
        writeTogglesToConfig();
        scheduleConfigSave();
    });

    loadUserPortraits();
    hydrateConfig();
    applyTheme(THEME_ORDER[themeIndex]);

    document.addEventListener("keydown", function (e) {
        if (e.key === "f" || e.key === "F") {
            if (tuner) {
                tuner.classList.toggle("show");
            }
        }
    });
    </script>
</body>
</html>
