<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <!-- Font: Zpix (最像素) by SolidZORO, free for personal use -- https://github.com/SolidZORO/zpix-pixel-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="fonts/ff8.js"></script>
    <script src="fonts/ct.js"></script>
    <script src="fonts/acww.js"></script>
    <script src="fonts/ff7.js"></script>
    <script src="fonts/fft.js"></script>
    <script src="fonts/minishcap.js"></script>
    <script src="fonts/mmbn1.js"></script>

    <style>
        :root {
            --ff-bg: rgba(10, 10, 46, 0.6);
            --ff-border: #c8aa6e;
            --ff-text: #f0e6d3;
            --ff-username: #5ca0f0;
            --ff-timestamp: #7a7a9a;
            --ff-dim: rgba(240, 230, 211, 0.35);
            --ff-mod: #ff7b6b;
            --ff-sub: #7bff9b;
            --ff-vip: #ffb86b;

            --ui-username: #f4f1ea;
            --ui-dim: rgba(244, 241, 234, 0.5);
            --ui-mod: #ff7b6b;
            --ui-sub: #7bff9b;
            --ui-vip: #e800e8;
            --ui-broadcaster: #d8d808;
            --ui-lh: 32px;
            --ui-y: 0px;
            --ui-top: 0px;
            --ui-bot: 0px;
            --ui-hx: 0px;
        }

        @font-face {
            font-family: 'Zpix';
            src: url("fonts/zpix.woff2") format("woff2");
            font-display: swap;
        }
        html, body {
            margin: 0;
            font-family: 'Zpix', 'SeedComputer', 'Press Start 2P', monospace;
        }

        #chat {
            width: 600px;
            height: 800px;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column-reverse;
            box-sizing: border-box;
            padding: 20px;
        }

        #chat:not(.no-bg) {
            background-color: var(--ff-bg);
            border: 6px solid var(--ff-border);
        }

        #chat.no-bg {
            background-color: transparent;
            border: 6px solid transparent;
        }

        #chat ul {
            list-style-type: none;
            list-style-position: outside;
            padding: 0;
            margin: 0;
        }

        /* ---- Default (Zpix webfont) theme ---- */
        #chat.theme-default {
            color: var(--ff-text);
            text-shadow: 2px 0 0 rgba(0,0,0,0.85), -2px 0 0 rgba(0,0,0,0.85),
                         0 2px 0 rgba(0,0,0,0.85), 0 -2px 0 rgba(0,0,0,0.85);
        }

        #chat.theme-default li {
            padding: 12px 4px;
            font-size: 24px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            border-bottom: 2px dashed rgba(200, 170, 110, 0.35);
        }

        #chat.theme-default .config-notice {
            color: var(--ff-text);
            font-size: 24px;
            padding: 12px 4px;
        }

        #chat.theme-default .user {
            color: var(--ff-username);
        }

        #chat.theme-default .user.mod { color: var(--ff-mod); }
        #chat.theme-default .user.sub { color: var(--ff-sub); }
        #chat.theme-default .user.vip { color: var(--ff-vip); }

        #chat.theme-default blockquote {
            margin: 8px 0 0 28px;
            color: var(--ff-text);
        }

        #chat.theme-default .timestamp {
            color: var(--ff-timestamp);
            font-size: 24px;
            margin-left: 12px;
        }

        /* ---- Atlas (crisp pixel font) themes ---- */
        #chat.theme-ff8, #chat.theme-ct, #chat.theme-acww, #chat.theme-ff7, #chat.theme-fft, #chat.theme-mc, #chat.theme-mmbn1 {
            color: #ffffff;
        }

        #chat.theme-ff8 li, #chat.theme-ct li, #chat.theme-acww li, #chat.theme-ff7 li, #chat.theme-fft li, #chat.theme-mc li, #chat.theme-mmbn1 li {
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 480px;
            box-sizing: border-box;
            background: transparent;
            border: none;
            position: relative;
            transform-origin: center;
            animation: pop 0.18s ease-out; /* keep in sync with POP_MS */
        }

        #chat.theme-ff8 .window-bg, #chat.theme-ct .window-bg, #chat.theme-acww .window-bg, #chat.theme-ff7 .window-bg, #chat.theme-fft .window-bg, #chat.theme-mc .window-bg, #chat.theme-mmbn1 .window-bg {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            image-rendering: pixelated;
            z-index: 0;
        }

        #chat.theme-ff8 .msg-box, #chat.theme-ct .msg-box, #chat.theme-acww .msg-box, #chat.theme-ff7 .msg-box, #chat.theme-fft .msg-box, #chat.theme-mc .msg-box, #chat.theme-mmbn1 .msg-box {
            position: relative;
            z-index: 1;
            padding: 20px 24px 16px 24px;
            background: transparent;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        #chat.theme-ff8 li + li, #chat.theme-ct li + li, #chat.theme-acww li + li, #chat.theme-ff7 li + li, #chat.theme-fft li + li, #chat.theme-mc li + li, #chat.theme-mmbn1 li + li {
            margin-top: 20px;
        }

        #chat.theme-ff8 .config-notice, #chat.theme-ct .config-notice, #chat.theme-acww .config-notice, #chat.theme-ff7 .config-notice, #chat.theme-fft .config-notice, #chat.theme-mc .config-notice, #chat.theme-mmbn1 .config-notice {
            color: var(--ff-text);
            font-size: 24px;
            padding: 12px 4px;
            background: transparent;
            box-shadow: none;
            text-shadow:
                2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
                0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
        }

        #chat.theme-ff8 .msg-box .username, #chat.theme-ct .msg-box .username, #chat.theme-acww .msg-box .username, #chat.theme-ff7 .msg-box .username, #chat.theme-fft .msg-box .username, #chat.theme-mc .msg-box .username, #chat.theme-mmbn1 .msg-box .username {
            color: var(--ui-username);
            font-size: 24px;
            line-height: var(--ui-lh, 32px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            word-break: break-word;
        }

        #chat.theme-ff8 .msg-header, #chat.theme-ct .msg-header, #chat.theme-acww .msg-header, #chat.theme-ff7 .msg-header, #chat.theme-fft .msg-header, #chat.theme-mc .msg-header, #chat.theme-mmbn1 .msg-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        #chat.theme-ff8 .msg-header .username, #chat.theme-ct .msg-header .username, #chat.theme-acww .msg-header .username, #chat.theme-ff7 .msg-header .username, #chat.theme-fft .msg-header .username, #chat.theme-mc .msg-header .username, #chat.theme-mmbn1 .msg-header .username {
            margin-bottom: 0;
        }

        #chat.theme-ff8 .msg-header .timestamp, #chat.theme-ct .msg-header .timestamp, #chat.theme-acww .msg-header .timestamp, #chat.theme-ff7 .msg-header .timestamp, #chat.theme-fft .msg-header .timestamp, #chat.theme-mc .msg-header .timestamp, #chat.theme-mmbn1 .msg-header .timestamp {
            opacity: 0.55;
            margin-left: 12px;
        }

        #chat.theme-ff8 .msg-box .message-text, #chat.theme-ct .msg-box .message-text, #chat.theme-acww .msg-box .message-text, #chat.theme-ff7 .msg-box .message-text, #chat.theme-fft .msg-box .message-text, #chat.theme-mc .msg-box .message-text, #chat.theme-mmbn1 .msg-box .message-text {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            line-height: var(--ui-lh, 32px);
            white-space: normal;
            word-break: break-word;
        }

        #chat.theme-acww li { max-width: none; }

        #chat.theme-acww .msg-box {
            width: 512px;
            box-sizing: border-box;
            padding: 24px 0 32px 0;
        }

        #chat.theme-acww .msg-header {
            position: relative;
            height: 48px;
            margin: 0;
        }

        #chat.theme-acww .name-tag {
            position: absolute;
            left: 56px;
            top: -24px;
            min-width: 178px;
            height: 44px;
            image-rendering: pixelated;
            z-index: 1;
        }

        #chat.theme-acww .msg-header .username {
            position: absolute;
            left: 90px;
            top: -15px;
            z-index: 2;
            line-height: 26px;
            white-space: nowrap;
            flex-wrap: nowrap;
        }

        #chat.theme-acww .msg-header .timestamp {
            position: absolute;
            right: 130px;
            top: 20px;
            z-index: 2;
            opacity: 0.9;
            margin-left: 0;
        }

        #chat.theme-acww .msg-box .message-text { margin: 4px 90px 0 90px; }

        #chat.theme-acww .continue-arrow {
            position: absolute;
            right: 55px;
            bottom: 20px;
            width: 32px;
            height: 34px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-ff7 .msg-box {
            padding: 12px 24px 16px 16px;
        }

        #chat.theme-fft li {
            max-width: 400px;
            min-width: 280px;
        }

        #chat.theme-fft .msg-box {
            padding: 36px 84px 12px 12px;
            min-height: 116px;
        }

        #chat.theme-fft .msg-header {
            margin: 0;
        }

        #chat.theme-fft .portrait {
            position: absolute;
            right: 20px;
            top: 38px;
            width: 64px;
            height: 96px;
            image-rendering: pixelated;
            z-index: 2;
        }

        #chat.theme-fft .msg-box .message-text {
            margin: 2px 0 0 0;
        }

        #chat.theme-mc li {
            min-width: 320px;
        }

        #chat.theme-mc .msg-box {
            padding: 16px 28px 16px 16px;
            min-height: 96px;
        }

        #chat.theme-mc .continue-arrow {
            position: absolute;
            right: 32px;
            bottom: 0;
            width: 14px;
            height: 12px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-mc .msg-box img.badge {
            vertical-align: 4px;
        }

        #chat.theme-mmbn1 li {
            min-width: 320px;
        }

        #chat.theme-mmbn1 .msg-box {
            padding: 24px 16px 16px 106px;
            min-height: 128px;
        }

        #chat.theme-mmbn1 .portrait {
            position: absolute;
            left: 16px;
            top: 16px;
            width: 80px;
            height: 96px;
            image-rendering: pixelated;
            z-index: 2;
        }

        #chat.theme-mmbn1 .continue-arrow {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 26px;
            height: 26px;
            image-rendering: pixelated;
            z-index: 3;
            opacity: 0.9;
        }

        #chat.theme-mmbn1 .msg-box img.badge {
            vertical-align: 4px;
        }

        /* ---- Shared ---- */

        #chat img.badge {
            height: 1em;
            width: auto;
            vertical-align: middle;
            margin-right: 8px;
            display: inline-block;
        }

        #chat .glyph-canvas {
            display: inline-block;
            vertical-align: baseline;
            image-rendering: pixelated;
            position: relative;
            top: var(--ui-y, 0px);
            left: var(--ui-hx, 0px);
        }

        #chat .bglyph {
            display: inline-block;
            background-image: var(--ui-atlas, none);
            background-size: var(--ui-bg-size, 2968px 224px);
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        #chat img.emote {
            height: 48px;
            vertical-align: middle;
            display: inline-block;
        }

        #chat.theme-default img.emote {
            height: 2em;
        }

        #chat .e-stack {
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        #chat .e-stack img.emote {
            display: block;
        }

        #chat .e-stack img.emote.overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #chat img.fx-flipx { transform: scaleX(-1); }
        #chat img.fx-flipy { transform: scaleY(-1); }
        #chat img.fx-wide {
            transform: scaleX(2);
            transform-origin: left center;
            margin-right: 2em;
        }
        #chat img.fx-flipx.fx-wide, #chat img.fx-wide.fx-flipx { transform: scaleX(-2); }
        #chat img.fx-cursed { filter: grayscale(1) contrast(1.6) brightness(0.88); }
        #chat img.fx-hyper {
            filter: saturate(3) hue-rotate(300deg) contrast(1.5);
            animation: fx-shake 0.12s linear infinite;
        }
        #chat img.fx-rainbow { animation: fx-rainbow 1s linear infinite; }
        #chat img.fx-jam { animation: fx-jam 0.5s linear infinite; }
        #chat img.fx-bounce { animation: fx-bounce 0.9s ease-in-out infinite; }
        #chat img.fx-spin { animation: fx-spin 1s linear infinite; }

        @keyframes fx-rainbow {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }
        @keyframes fx-shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-3px, 2px); }
            50%  { transform: translate(3px, -2px); }
            75%  { transform: translate(-2px, -3px); }
            100% { transform: translate(2px, 3px); }
        }
        @keyframes fx-jam {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(3px) rotate(-4deg); }
            75%      { transform: translateY(-3px) rotate(4deg); }
        }
        @keyframes fx-bounce {
            0%, 100% { transform: scaleY(1); }
            20%      { transform: scaleY(0.7); }
            40%      { transform: scaleX(-1) scaleY(1); }
            60%      { transform: scaleX(-1) scaleY(0.7); }
            80%      { transform: scaleY(1); }
        }
        @keyframes fx-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        #chat ul.dim-past li:not(:last-of-type) {
            opacity: 0.6;
        }

        #chat ul.hide-badges img.badge-other { display: none; }

        #chat ul.hide-role-badges img.badge-role { display: none; }

        #chat ul.hide-timestamps .timestamp { display: none; }

        #chat ul.fade-expire li { transition: opacity 0.8s ease; }
        #chat ul.fade-expire li.expiring { opacity: 0 !important; }

        #chat ul.align-center li     { margin-left: auto; margin-right: auto; }
        #chat ul.align-right li      { margin-left: auto; margin-right: 0; }
        #chat ul.align-alternate li:nth-child(odd)  { margin-left: 0; margin-right: auto; }
        #chat ul.align-alternate li:nth-child(even) { margin-left: auto; margin-right: 0; }

        #chat ul.align-center .msg-content     { margin-left: auto; margin-right: auto; width: fit-content; }
        #chat ul.align-right .msg-content      { margin-left: auto; margin-right: 0;    width: fit-content; }
        #chat ul.align-alternate li:nth-child(odd)  .msg-content { margin-left: 0;    margin-right: auto; width: fit-content; }
        #chat ul.align-alternate li:nth-child(even) .msg-content { margin-left: auto; margin-right: 0;    width: fit-content; }

        #tuner {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: 210px;
            padding: 12px;
            background: #14120f;
            border: 2px solid #54514a;
            box-shadow: 3px 3px 0 #050505;
            color: #f4f1ea;
            font-size: 12px;
            display: none;
        }
        #tuner.show { display: block; }
        #tuner h1 {
            margin: 0 0 8px 0;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--ui-mod);
        }
        #tuner h1 span { color: var(--ui-dim); font-size: 10px; }
        #tuner .tuner-row {
            display: flex;
            align-items: center;
            margin: 6px 0;
            line-height: 1.4;
        }
        #tuner .tuner-row label {
            flex: 1;
            margin-right: 8px;
        }
        #tuner .tuner-row output {
            flex: 1;
            text-align: center;
            color: #ffffff;
        }
        #tuner button {
            width: 32px;
            height: 28px;
            padding: 0;
            background: #54514a;
            border: 2px solid #33312c;
            box-shadow: 2px 2px 0 #050505;
            color: #f4f1ea;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        #tuner button:active { transform: translate(2px, 2px); box-shadow: none; }
        #tuner .tuner-toggle { width: 60px; }
        #tuner input[type="range"] {
            flex: 1;
            margin: 0 8px 0 0;
            min-width: 0;
        }
        #tuner-fade-secs-out { min-width: 30px; text-align: center; }
        #tuner input[type="range"] { flex: 1; margin: 0 8px 0 0; min-width: 0; }
        #tuner #tuner-fade-secs-out { flex: initial; min-width: 36px; text-align: right; }
    </style>

</head>
<body>
    <div id="chat" class="theme-default">
        <ul>
        </ul>
    </div>
    <div id="tuner">
        <h1>Tuner <span>(F)</span></h1>
        <div class="tuner-row">
            <label for="tuner-theme">Theme</label>
            <button id="theme-prev">◀</button>
            <output id="tuner-theme">Default</output>
            <button id="theme-next">▶</button>
        </div>
        <div id="tuner-options"></div>
        <div class="tuner-row">
            <label for="tuner-mode">Alignment</label>
            <button id="tuner-prev">◀</button>
            <output id="tuner-mode">Left</output>
            <button id="tuner-next">▶</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-dim">Dim</label>
            <button id="tuner-dim" class="tuner-toggle">On</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-role-badges">Role Badges</label>
            <button id="tuner-role-badges" class="tuner-toggle">On</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-badges">Badges</label>
            <button id="tuner-badges" class="tuner-toggle">On</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-timestamps">Timestamps</label>
            <button id="tuner-timestamps" class="tuner-toggle">Off</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-bg">Background</label>
            <button id="tuner-bg" class="tuner-toggle">Off</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-fade">Fade Out</label>
            <button id="tuner-fade" class="tuner-toggle">Off</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-fade-secs">Seconds</label>
            <input id="tuner-fade-secs" type="range" min="5" max="120" step="5" value="30">
            <output id="tuner-fade-secs-out">30s</output>
        </div>
    </div>
    <script>
    var chat = document.querySelector("#chat>ul");

    function escapeHtml(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    var PIXEL_SCALE = 2;
    var POP_MS = 180;
    var GLYPH_H = 12;

    function glyphHeight() {
        var d = currentTheme && currentTheme.data && currentTheme.data.default;
        return (d && d.h) || GLYPH_H;
    }
    var GLYPHS = {};
    var WINDOW_STYLES = [];
    var PORTRAITS = [];
    var atlas = null;
    var boxImg = null;
    var atlasCache = {};
    var boxCache = {};
    var themeLoaded = false;
    var currentTheme = null;
    var chatHistory = [];
    var MAX_HISTORY = 30;

    var THEMES = {
        default: {
            key: "default",
            label: "Default",
            atlas: null,
            data: null,
            windowBorder: 0,
            drawMode: null,
            userRows: null,
            mapApostrophe: false
        },
        ff8: {
            key: "ff8",
            label: "Final Fantasy VIII",
            atlas: "fonts/ff8-font.png",
            data: (typeof THEME_DATA_FF8 === "object" && THEME_DATA_FF8) ? THEME_DATA_FF8 : null,
            windowBorder: 2,
            drawMode: "border",
            userRows: { broadcaster: 60, mod: 48, sub: 36, vip: 12 },
            mapApostrophe: true
        },
        ct: {
            key: "ct",
            label: "Chrono Trigger",
            atlas: "fonts/ct-font.png",
            data: (typeof THEME_DATA_CT === "object" && THEME_DATA_CT) ? THEME_DATA_CT : null,
            windowBorder: 8,
            drawMode: "style",
            userRows: null,
            mapApostrophe: false,
            tuner: ["windowStyle"]
        },
        acww: {
            key: "acww",
            label: "Animal Crossing: Wild World",
            atlas: "fonts/acww-font.png",
            data: (typeof THEME_DATA_ACWW === "object" && THEME_DATA_ACWW) ? THEME_DATA_ACWW : null,
            windowBorder: 24,
            drawMode: "style",
            userRows: null,
            mapApostrophe: false,
            nameTag: true,
            chromaKey: true,
            chromaKeyRects: function (style) {
                if (style && style.name === "thought") return [];
                return [
                    { x: 28, y: 0, w: 89, h: 20 },
                    { x: 117, y: 10, w: 44, h: 1 }
                ];
            },
            continueArrow: true,
            tuner: ["windowStyle", "nameColor"]
        },
        ff7: {
            key: "ff7",
            label: "Final Fantasy VII",
            atlas: "fonts/ff7-font.png",
            data: (typeof THEME_DATA_FF7 === "object" && THEME_DATA_FF7) ? THEME_DATA_FF7 : null,
            windowBorder: 4,
            drawMode: "border",
            userRows: null,
            mapApostrophe: true
        },
        fft: {
            key: "fft",

            if (done >= units.length) {
                clearInterval(timer);
                return;
            }
            applyUnit(blockquote, state, units[done]);

    function renderAll(blockquote, units) {
        var state = { lastCanvas: null };

    function applyOverlays(blockquote) {
        blockquote.querySelectorAll("img.overlay").forEach(function (img) {
            if (img.closest(".e-stack")) return;
            var node = img.previousSibling;
            var base = null;
            while (node && node !== blockquote) {
                if (node.nodeType === 3) {
                    if (!/\S/.test(node.nodeValue.replace(/\u200b/g, ""))) {
                        node = node.previousSibling;
                        continue;
                    }
                    break;
                }
                if (node.nodeType === 1) {
                    if (node.classList.contains("emote")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("e-stack")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("glyph-canvas") &&
                        node._txt && !/\S/.test(node._txt)) {
                        node = node.previousSibling;
                        continue;
                    }
                }
                break;
            }
            if (!base) return;
            var stack;
            if (base.classList && base.classList.contains("e-stack")) {
                stack = base;
            } else {
                stack = document.createElement("span");
                stack.className = "e-stack";
                base.parentNode.replaceChild(stack, base);
                stack.appendChild(base);
            }
            stack.appendChild(img);

    function parseTwitchRanges(messageEmotes) {
        var parsed = {};
        if (typeof messageEmotes === "string") {
            messageEmotes.split("/").forEach(function (group) {
                if (!group) return;
                var colon = group.indexOf(":");
                var id = group.slice(0, colon);
                var ranges = group.slice(colon + 1).split(",");
                parsed[id] = ranges.map(function (r) {
                    var dash = r.indexOf("-");
                    return [r.slice(0, dash), r.slice(dash + 1)];
                });
            });
        } else if (messageEmotes && typeof messageEmotes === "object") {
            parsed = messageEmotes;
        }
        var ranges = [];
        Object.keys(parsed).forEach(function (emoteId) {
            parsed[emoteId].forEach(function (r) {
                var start, end;
                if (typeof r === "string") {
                    var dash = r.indexOf("-");
                    start = parseInt(r.slice(0, dash), 10);
                    end = parseInt(r.slice(dash + 1), 10);
                } else {
                    start = parseInt(r[0], 10);
                    end = parseInt(r[1], 10);
                }
                ranges.push({ id: emoteId, start: start, end: end });
            });
        });
        ranges.sort(function (a, b) { return a.start - b.start; });
        return ranges;
    }

    function twitchEmoteUnit(range) {
        var url = "https://static-cdn.jtvnw.net/emoticons/v2/" +
            range.id + "/default/dark/3.0";
        return emoteImg(url);
    }

    function buildUnits(message, messageEmotes) {
        if (!currentTheme.atlas) return buildDefaultUnits(message, messageEmotes);
        var twitchRanges = parseTwitchRanges(messageEmotes);
        var units = [];
        var i = 0;

        function nearTwitchRange() {
            for (var k = 0; k < twitchRanges.length; k++) {
                if (twitchRanges[k].start === i) return twitchRanges[k];
            }
            return null;
        }

        while (i < message.length) {
            var range = nearTwitchRange();
            if (range) {
                units.push({ html: twitchEmoteUnit(range) });
                i = range.end + 1;
                continue;
            }
            if (/\s/.test(message[i])) {
                units.push(glyphOrTextUnit(message[i], 0));
                units.push({ html: "\u200b" });
                i++;
                continue;
            }
            var wordEnd = i;
            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {
                var r2 = null;
                for (var k2 = 0; k2 < twitchRanges.length; k2++) {
                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }
                if (r2) break;
                wordEnd++;
            }
            var word = message.slice(i, wordEnd);
            var overlay = false;
            var url = sevenTv[word];
            if (!url && sevenTvOverlay[word]) {
                url = sevenTvOverlay[word];
                overlay = true;
            }
            if (!url) {
                url = bttv[word];
                if (!url && bttvOverlay[word]) {
                    url = bttvOverlay[word];
                    overlay = true;
                }
            }
            if (!url) {
                var lead = 0;
                while (lead < word.length && /^[([{<]$/.test(word[lead])) lead++;
                var tail = 0;
                while (tail < word.length - lead && /^[!.,;:?)\]}>]$/.test(word[word.length - 1 - tail])) tail++;
                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push(glyphOrTextUnit(word[u], 0));
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push(glyphOrTextUnit(word[word.length - tail + u], 0));
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p = units.length - 1; p >= 0; p--) {
                    if (units[p].glyph) {
                        if (!/\S/.test(units[p].glyph)) continue;
                        prevEmote = false;
                        break;
                    }
                    var h = units[p].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h.replace(/\u200b/g, ""))) continue;
                    prevEmote = /<img /.test(h);
                    break;
                }
                if (prevEmote) {
                    units.push({ mod: fx });
                    i = wordEnd;
                    continue;
                }
            }
            if (url) {
                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;
                continue;
            }
            var wrap = 0;
            for (var c = i; c < wordEnd; c++) {
                units.push(glyphOrTextUnit(resolveQuote(message[c], message, c), 0));
                if (c < wordEnd - 1 && ++wrap >= 26) { units.push({ html: "\u200b" }); wrap = 0; }
            }
            i = wordEnd;
        }
        return units;
    }

    function buildDefaultUnits(message, messageEmotes) {

            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {

                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }

            }

            var url = sevenTv[word];

                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push({ html: escapeHtml(word[u]) });
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push({ html: escapeHtml(word[word.length - tail + u]) });
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p2 = units.length - 1; p2 >= 0; p2--) {
                    var h = units[p2].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h)) continue;

                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;

            for (var c = i; c < wordEnd; c++) units.push({ html: escapeHtml(message[c]) });

    function dropOldestMessage() {

    function nameRowFor(flags) {
        if (currentTheme.nameRow != null) return currentTheme.nameRow;
        var rows = currentTheme.userRows;
        if (rows && rows.broadcaster != null) {
            if (flags.broadcaster) return rows.broadcaster;

    function buildNamePrefix(record, nameRow) {
        var prefix = [];
        var bhtml = resolveBadgeHtml(record.extra, record.flags);
        if (bhtml) prefix.push({ html: bhtml });
        var user = record.user;
        var i;
        for (i = 0; i < user.length; i++) prefix.push(glyphOrTextUnit(user[i], nameRow));
        if (timestampsOn) {
            var now = new Date(record.ts || Date.now());
            var hh = String(now.getHours()).padStart(2, "0");
            var mm = String(now.getMinutes()).padStart(2, "0");
            var tsText = " (" + hh + ":" + mm + ")";
            for (i = 0; i < tsText.length; i++) prefix.push(glyphOrTextUnit(tsText[i], nameRow));
        }
        var suffix = ": ";
        for (i = 0; i < suffix.length; i++) prefix.push(glyphOrTextUnit(suffix[i], nameRow));
        prefix.push({ html: "\u200b" });
        return prefix;
    }

    function fitNameTag(tag, style, cssWidth) {
        var ctx = tag.getContext("2d");
        var minW = style.w * PIXEL_SCALE;
        tag.width = Math.max(minW, cssWidth);
        tag.height = style.h * PIXEL_SCALE;
        ctx.clearRect(0, 0, tag.width, tag.height);
        if (!atlasReady()) return;
        ctx.imageSmoothingEnabled = false;
        var L = 20, R = 10;
        var sh = style.h;
        var leftW = L * PIXEL_SCALE;
        var rightW = R * PIXEL_SCALE;
        var stretch = tag.width - leftW - rightW;
        ctx.drawImage(atlas, style.x, style.y, L, sh, 0, 0, leftW, tag.height);
        ctx.drawImage(atlas, style.x + L, style.y, style.w - L - R, sh, leftW, 0, stretch, tag.height);
        ctx.drawImage(atlas, style.x + style.w - R, style.y, R, sh, tag.width - rightW, 0, rightW, tag.height);
    }

    function buildMessageNode(record) {
        var user = record.user, message = record.message, flags = record.flags, extra = record.extra;
        var useAtlas = !!currentTheme.atlas;

        if (!useAtlas) {

        var box = document.createElement("div");

    }

    function applyTunerMode() {
        tunerLabel.textContent = TUNER_MODES[tunerMode];
        applyTunerClass();
    }

    function applyDim() {
        dimBtn.textContent = dimOn ? "On" : "Off";
        applyTunerClass();
    }

    function applyBadges() {
        badgesBtn.textContent = badgesOn ? "On" : "Off";
        applyTunerClass();
        renderAllHistory();
    }

    function applyRoleBadges() {
        roleBadgesBtn.textContent = roleBadgesOn ? "On" : "Off";
        applyTunerClass();
        renderAllHistory();
    }

    function applyTimestamps() {
        timestampsBtn.textContent = timestampsOn ? "On" : "Off";
        applyTunerClass();
        renderAllHistory();
    }

    function applyBg() {
        bgBtn.textContent = bgOn ? "On" : "Off";
        applyTunerClass();
    }

    function applyFade() {
        fadeBtn.textContent = fadeOn ? "On" : "Off";
        applyTunerClass();
        syncExpireTimer();
    }

    function applyFadeSeconds() {
        fadeSecsInput.value = fadeSeconds;
        fadeSecsOut.textContent = fadeSeconds + "s";
    }

    function syncExpireTimer() {
        if (fadeOn && !expireTimer) {
            expireTimer = setInterval(expireLoop, 250);
        } else if (!fadeOn && expireTimer) {
            clearInterval(expireTimer);
            expireTimer = null;
        }
    }

    function expireLoop() {
        var limit = fadeSeconds * 1000;
        var now = Date.now();
        for (var i = chatHistory.length - 1; i >= 0; i--) {
            if (now - (chatHistory[i].ts || now) >= limit) {
                expireMessage(chatHistory[i]);
            }
        }
    }

    function expireMessage(record) {
        if (record.expiring) return;
        record.expiring = true;
        var node = record.node;
        if (node) {
            node.classList.add("expiring");
            setTimeout(function () {
                if (node.parentNode) node.parentNode.removeChild(node);
            }, FADE_MS);
        }
        var i = chatHistory.indexOf(record);
        if (i >= 0) chatHistory.splice(i, 1);
    }

    document.getElementById("theme-prev").addEventListener("click", function () {
        themeIndex = (themeIndex + THEME_ORDER.length - 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
    });

    document.getElementById("theme-next").addEventListener("click", function () {
        themeIndex = (themeIndex + 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
    });

    document.getElementById("tuner-prev").addEventListener("click", function () {
        tunerMode = (tunerMode + TUNER_MODES.length - 1) % TUNER_MODES.length;
        applyTunerMode();
    });

    document.getElementById("tuner-next").addEventListener("click", function () {
        tunerMode = (tunerMode + 1) % TUNER_MODES.length;
        applyTunerMode();
    });

    dimBtn.addEventListener("click", function () {
        dimOn = !dimOn;
        applyDim();
    });

    badgesBtn.addEventListener("click", function () {
        badgesOn = !badgesOn;
        applyBadges();
    });

    roleBadgesBtn.addEventListener("click", function () {
        roleBadgesOn = !roleBadgesOn;
        applyRoleBadges();
    });

    timestampsBtn.addEventListener("click", function () {
        timestampsOn = !timestampsOn;
        applyTimestamps();
    });

    bgBtn.addEventListener("click", function () {
        bgOn = !bgOn;
        applyBg();
    });

    fadeBtn.addEventListener("click", function () {
        fadeOn = !fadeOn;
        applyFade();
    });

    fadeSecsInput.addEventListener("input", function () {
        fadeSeconds = parseInt(fadeSecsInput.value, 10) || 30;
        applyFadeSeconds();
    });

    applyTheme("default");

    document.addEventListener("keydown", function (e) {
        if (e.key === "f" || e.key === "F") {
            if (tuner) {
                tuner.classList.toggle("show");
            }
        }
    });
    </script>
</body>
</html>
