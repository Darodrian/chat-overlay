<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch chat</title>
    <!-- Font: Zpix (最像素) by SolidZORO, free for personal use -- https://github.com/SolidZORO/zpix-pixel-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="fonts/ff8.js"></script>
    <script src="fonts/ct.js"></script>

    <style>
        :root {
            --ff-bg: rgba(10, 10, 46, 0.6);
            --ff-border: #c8aa6e;
            --ff-text: #f0e6d3;
            --ff-username: #5ca0f0;
            --ff-timestamp: #7a7a9a;
            --ff-dim: rgba(240, 230, 211, 0.35);
            --ff-mod: #ff7b6b;
            --ff-sub: #7bff9b;
            --ff-vip: #ffb86b;

            --ui-username: #f4f1ea;
            --ui-dim: rgba(244, 241, 234, 0.5);
            --ui-mod: #ff7b6b;
            --ui-sub: #7bff9b;
            --ui-vip: #e800e8;
            --ui-broadcaster: #d8d808;
            --ui-lh: 32px;
            --ui-y: 0px;
            --ui-top: 0px;
            --ui-bot: 0px;
            --ui-hx: 0px;
        }

        @font-face {
            font-family: 'Zpix';
            src: url("fonts/zpix.woff2") format("woff2");
            font-display: swap;
        }
        html, body {
            margin: 0;
            font-family: 'Zpix', 'SeedComputer', 'Press Start 2P', monospace;
        }

        #chat {
            width: 600px;
            height: 800px;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column-reverse;
            box-sizing: border-box;
            padding: 20px;
        }

        #chat ul {
            list-style-type: none;
            list-style-position: outside;
            padding: 0;
            margin: 0;
        }

        /* ---- Default (Zpix webfont) theme ---- */
        #chat.theme-default {
            background-color: var(--ff-bg);
            border: 6px solid var(--ff-border);
            color: var(--ff-text);
        }

        #chat.theme-default li {
            padding: 12px 4px;
            font-size: 32px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            border-bottom: 2px dashed rgba(200, 170, 110, 0.35);
        }

        #chat.theme-default .config-notice {
            color: var(--ff-dim);
            font-size: 24px;
            padding: 12px 4px;
        }

        #chat.theme-default .user {
            color: var(--ff-username);
        }

        #chat.theme-default .user.mod { color: var(--ff-mod); }
        #chat.theme-default .user.sub { color: var(--ff-sub); }
        #chat.theme-default .user.vip { color: var(--ff-vip); }

        #chat.theme-default blockquote {
            margin: 8px 0 0 28px;
            color: var(--ff-text);
        }

        #chat.theme-default .timestamp {
            color: var(--ff-timestamp);
            font-size: 32px;
            margin-left: 12px;
        }

        /* ---- Atlas (crisp pixel font) themes ---- */
        #chat.theme-ff8, #chat.theme-ct {
            background: transparent;
            color: #ffffff;
        }

        #chat.theme-ff8 li, #chat.theme-ct li {
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 480px;
            box-sizing: border-box;
            background: transparent;
            border: none;
            position: relative;
            transform-origin: center;
            animation: pop 0.18s ease-out; /* keep in sync with POP_MS */
        }

        #chat.theme-ff8 .window-bg, #chat.theme-ct .window-bg {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            image-rendering: pixelated;
            z-index: 0;
        }

        #chat.theme-ff8 .msg-box, #chat.theme-ct .msg-box {
            position: relative;
            z-index: 1;
            padding: 20px 24px 16px 24px;
            background: transparent;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        #chat.theme-ff8 li + li, #chat.theme-ct li + li {
            margin-top: 20px;
        }

        #chat.theme-ff8 .config-notice, #chat.theme-ct .config-notice {
            color: var(--ui-dim);
            font-size: 24px;
            padding: 12px 4px;
            background: transparent;
            box-shadow: none;
            text-shadow:
                2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
                0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
        }

        #chat.theme-ff8 .msg-box .username, #chat.theme-ct .msg-box .username {
            color: var(--ui-username);
            font-size: 24px;
            line-height: var(--ui-lh, 32px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
            word-break: break-word;
        }

        #chat.theme-ff8 .msg-box .message-text, #chat.theme-ct .msg-box .message-text {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            line-height: var(--ui-lh, 32px);
            white-space: normal;
            word-break: break-word;
        }

        /* ---- Shared ---- */

        #chat img.badge {
            height: 1em;
            width: auto;
            vertical-align: middle;
            margin-right: 8px;
            display: inline-block;
        }

        #chat .glyph-canvas {
            display: inline-block;
            vertical-align: baseline;
            image-rendering: pixelated;
            position: relative;
            top: var(--ui-y, 0px);
            left: var(--ui-hx, 0px);
        }

        #chat .bglyph {
            display: inline-block;
            background-image: var(--ui-atlas, none);
            background-size: var(--ui-bg-size, 2968px 224px);
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        #chat img.emote {
            height: 48px;
            vertical-align: middle;
            display: inline-block;
        }

        #chat.theme-default img.emote {
            height: 2em;
        }

        #chat .e-stack {
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        #chat .e-stack img.emote {
            display: block;
        }

        #chat .e-stack img.emote.overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #chat img.fx-flipx { transform: scaleX(-1); }
        #chat img.fx-flipy { transform: scaleY(-1); }
        #chat img.fx-wide {
            transform: scaleX(2);
            transform-origin: left center;
            margin-right: 2em;
        }
        #chat img.fx-flipx.fx-wide, #chat img.fx-wide.fx-flipx { transform: scaleX(-2); }
        #chat img.fx-cursed { filter: grayscale(1) contrast(1.6) brightness(0.88); }
        #chat img.fx-hyper {
            filter: saturate(3) hue-rotate(300deg) contrast(1.5);
            animation: fx-shake 0.12s linear infinite;
        }
        #chat img.fx-rainbow { animation: fx-rainbow 1s linear infinite; }
        #chat img.fx-jam { animation: fx-jam 0.5s linear infinite; }
        #chat img.fx-bounce { animation: fx-bounce 0.9s ease-in-out infinite; }
        #chat img.fx-spin { animation: fx-spin 1s linear infinite; }

        @keyframes fx-rainbow {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }
        @keyframes fx-shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-3px, 2px); }
            50%  { transform: translate(3px, -2px); }
            75%  { transform: translate(-2px, -3px); }
            100% { transform: translate(2px, 3px); }
        }
        @keyframes fx-jam {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(3px) rotate(-4deg); }
            75%      { transform: translateY(-3px) rotate(4deg); }
        }
        @keyframes fx-bounce {
            0%, 100% { transform: scaleY(1); }
            20%      { transform: scaleY(0.7); }
            40%      { transform: scaleX(-1) scaleY(1); }
            60%      { transform: scaleX(-1) scaleY(0.7); }
            80%      { transform: scaleY(1); }
        }
        @keyframes fx-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        #chat ul.dim-past li:not(:last-of-type) {
            opacity: 0.6;
        }

        #chat ul.hide-badges img.badge { display: none; }

        #chat ul.align-center li     { margin-left: auto; margin-right: auto; }
        #chat ul.align-right li      { margin-left: auto; margin-right: 0; }
        #chat ul.align-alternate li:nth-child(odd)  { margin-left: 0; margin-right: auto; }
        #chat ul.align-alternate li:nth-child(even) { margin-left: auto; margin-right: 0; }

        #tuner {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: 210px;
            padding: 12px;
            background: #14120f;
            border: 2px solid #54514a;
            box-shadow: 3px 3px 0 #050505;
            color: #f4f1ea;
            font-size: 12px;
            display: none;
        }
        #tuner.show { display: block; }
        #tuner h1 {
            margin: 0 0 8px 0;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--ui-mod);
        }
        #tuner h1 span { color: var(--ui-dim); font-size: 10px; }
        #tuner .tuner-row {
            display: flex;
            align-items: center;
            margin: 6px 0;
            line-height: 1.4;
        }
        #tuner .tuner-row label {
            flex: 1;
            margin-right: 8px;
        }
        #tuner .tuner-row output {
            flex: 1;
            text-align: center;
            color: #ffffff;
        }
        #tuner button {
            width: 32px;
            height: 28px;
            padding: 0;
            background: #54514a;
            border: 2px solid #33312c;
            box-shadow: 2px 2px 0 #050505;
            color: #f4f1ea;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        #tuner button:active { transform: translate(2px, 2px); box-shadow: none; }
        #tuner .tuner-toggle { width: 60px; }
    </style>

</head>
<body>
    <div id="chat" class="theme-default">
        <ul>
        </ul>
    </div>
    <div id="tuner">
        <h1>Tuner <span>(F)</span></h1>
        <div class="tuner-row">
            <label for="tuner-theme">Theme</label>
            <button id="theme-prev">◀</button>
            <output id="tuner-theme">Default</output>
            <button id="theme-next">▶</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-mode">Alignment</label>
            <button id="tuner-prev">◀</button>
            <output id="tuner-mode">Left</output>
            <button id="tuner-next">▶</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-dim">Dim</label>
            <button id="tuner-dim" class="tuner-toggle">On</button>
        </div>
        <div class="tuner-row">
            <label for="tuner-badges">Badges</label>
            <button id="tuner-badges" class="tuner-toggle">On</button>
        </div>
    </div>
    <script>
    var chat = document.querySelector("#chat>ul");

    function escapeHtml(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    var PIXEL_SCALE = 2;
    var POP_MS = 180;
    var GLYPH_H = 12;
    var GLYPHS = {};
    var WINDOW_STYLES = [];
    var atlas = null;
    var atlasCache = {};
    var themeLoaded = false;
    var currentTheme = null;
    var chatHistory = [];

    var THEMES = {
        default: {
            key: "default",
            label: "Default",
            atlas: null,
            data: null,
            windowBorder: 0,
            drawMode: null,
            userRows: null,
            mapApostrophe: false,
            badgesDefault: true,
            dimDefault: true,
            modeDefault: 0
        },
        ff8: {
            key: "ff8",
            label: "FF8",
            atlas: "fonts/ff8-font.png",
            data: (typeof THEME_DATA_FF8 === "object" && THEME_DATA_FF8) ? THEME_DATA_FF8 : null,
            windowBorder: 2,
            drawMode: "border",
            userRows: { broadcaster: 60, mod: 48, sub: 36, vip: 12 },
            mapApostrophe: true,
            badgesDefault: false,
            dimDefault: true,
            modeDefault: 0
        },
        ct: {
            key: "ct",
            label: "Chrono Trigger",
            atlas: "fonts/ct-font.png",
            data: (typeof THEME_DATA_CT === "object" && THEME_DATA_CT) ? THEME_DATA_CT : null,
            windowBorder: 8,
            drawMode: "style",
            userRows: null,
            mapApostrophe: false,
            badgesDefault: true,
            dimDefault: true,
            modeDefault: 0
        }
    };

    function loadThemeData(data) {
        GLYPHS = {};
        WINDOW_STYLES = [];
        if (data && typeof data === "object") {
            Object.keys(data).forEach(function (k) {
                var v = data[k];
                if (/^\d+$/.test(k) && v && "x" in v && "w" in v) {
                    GLYPHS[parseInt(k, 10)] = v;
                }
            });
            if (GLYPHS[8221]) GLYPHS[34] = GLYPHS[8221];
            if (currentTheme && currentTheme.mapApostrophe && GLYPHS[8217]) GLYPHS[39] = GLYPHS[8217];
            var ws = data.overlays && data.overlays.window_style;
            if (ws && ws.options && typeof ws.options === "object") {
                Object.keys(ws.options).forEach(function (name) {
                    var o = ws.options[name];
                    if (o && "x" in o && "y" in o && "w" in o && "h" in o) {
                        WINDOW_STYLES.push(o);
                    }
                });
            }
        }
        themeLoaded = true;
    }

    function applyTheme(key) {
        var t = THEMES[key];
        if (!t) return;
        currentTheme = t;
        themeLoaded = false;
        loadThemeData(t.data);
        if (t.atlas) {
            var img = atlasCache[t.key];
            if (!img) {
                img = new Image();
                img.onload = function () {
                    document.documentElement.style.setProperty("--ui-bg-size",
                        this.naturalWidth + "px " + this.naturalHeight + "px");
                    if (currentTheme === t) renderAllHistory();
                };
                img.onerror = function () {};
                img.src = t.atlas;
                atlasCache[t.key] = img;
            }
            atlas = img;
            document.documentElement.style.setProperty("--ui-atlas", "url(\"" + t.atlas + "\")");
        } else {
            atlas = null;
            document.documentElement.style.setProperty("--ui-atlas", "none");
        }
        tunerMode = t.modeDefault || 0;
        dimOn = t.dimDefault !== false;
        badgesOn = !!t.badgesDefault;
        applyTunerMode();
        applyDim();
        applyBadges();
        themeLabel.textContent = t.label;
        applyTunerClass();
        renderAllHistory();
    }

    function atlasReady() {
        return themeLoaded && !!atlas && atlas.complete && atlas.naturalWidth > 0;
    }

    function uiVar(name) {
        var v = getComputedStyle(document.documentElement).getPropertyValue(name);
        return v ? (parseFloat(v) || 0) : 0;
    }

    function drawTextOnCanvas(canvas, text, row) {
        var top = uiVar("--ui-top");
        var bot = uiVar("--ui-bot");
        var ih = Math.max(1, GLYPH_H - top - bot);
        var total = 0;
        var i;
        for (i = 0; i < text.length; i++) {
            var g = GLYPHS[text.charCodeAt(i)];
            if (g) total += g.w;
        }
        canvas.width = total;
        canvas.height = ih;
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, total, ih);
        if (total && atlasReady()) {
            ctx.imageSmoothingEnabled = false;
            var x = 0;
            for (i = 0; i < text.length; i++) {
                var g2 = GLYPHS[text.charCodeAt(i)];
                if (!g2) continue;
                ctx.drawImage(atlas, g2.x, row + top, g2.w, ih, x, 0, g2.w, ih);
                x += g2.w;
            }
        }
        canvas.style.width = (total * PIXEL_SCALE) + "px";
        canvas.style.height = (ih * PIXEL_SCALE) + "px";
    }

    function randomWindow() {
        if (!WINDOW_STYLES.length) return null;
        return WINDOW_STYLES[Math.floor(Math.random() * WINDOW_STYLES.length)];
    }

    function drawWindow(canvas, style, w, h) {
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        if (!atlasReady() || !style || w <= 0 || h <= 0) return;
        ctx.imageSmoothingEnabled = false;
        var img = atlas;

        if (currentTheme.drawMode === "style") {
            var b = currentTheme.windowBorder;
            var bs = b * PIXEL_SCALE;
            var sx = style.x, sy = style.y, sw = style.w, sh = style.h;
            var intW = w - 2 * bs, intH = h - 2 * bs;
            var edgeW = sw - 2 * b, edgeH = sh - 2 * b;
            var wp = function (sx2, sy2, sw2, sh2, dx, dy, dw, dh) {
                if (dw > 0 && dh > 0) ctx.drawImage(img, sx2, sy2, sw2, sh2, dx, dy, dw, dh);
            };
            wp(sx, sy, b, b, 0, 0, bs, bs);
            wp(sx + sw - b, sy, b, b, w - bs, 0, bs, bs);
            wp(sx, sy + sh - b, b, b, 0, h - bs, bs, bs);
            wp(sx + sw - b, sy + sh - b, b, b, w - bs, h - bs, bs, bs);
            wp(sx + b, sy, edgeW, b, bs, 0, intW, bs);
            wp(sx + b, sy + sh - b, edgeW, b, bs, h - bs, intW, bs);
            wp(sx, sy + b, b, edgeH, 0, bs, bs, intH);
            wp(sx + sw - b, sy + b, b, edgeH, w - bs, bs, bs, intH);
            wp(sx + b, sy + b, edgeW, edgeH, bs, bs, intW, intH);
            return;
        }

        var bd = currentTheme.data.border || {};
        var cs = currentTheme.windowBorder * PIXEL_SCALE;
        function part(name, dx, dy, dw, dh) {
            var p = bd[name];
            if (!p) return;
            if (dw > 0 && dh > 0) ctx.drawImage(img, p.x, p.y, p.w, p.h, dx, dy, dw, dh);
        }
        part("tl", 0, 0, cs, cs);
        part("t", cs, 0, w - 2 * cs, cs);
        part("tr", w - cs, 0, cs, cs);
        part("l", 0, cs, cs, h - 2 * cs);
        part("c", cs, cs, w - 2 * cs, h - 2 * cs);
        part("r", w - cs, cs, cs, h - 2 * cs);
        part("bl", 0, h - cs, cs, cs);
        part("b", cs, h - cs, w - 2 * cs, cs);
        part("br", w - cs, h - cs, cs, cs);
    }

    function glyphOrTextUnit(ch, row) {
        if (atlasReady() && GLYPHS[ch.charCodeAt(0)]) return { glyph: ch, row: row };
        return { html: escapeHtml(ch) };
    }

    function resolveQuote(ch, msg, i) {
        if (ch !== "\"" && ch !== "'") return ch;
        var prev = i > 0 ? msg[i - 1] : "";
        var next = i < msg.length - 1 ? msg[i + 1] : "";
        if (!next || /\s/.test(next) || /[)\]}>.,;:!?]/.test(prev)) {
            return ch === "\"" ? "\u201d" : "\u2019";
        }
        if (!prev || /\s/.test(prev) || /[([{<]/.test(prev)) {
            return ch === "\"" ? "\u201c" : "\u2018";
        }
        if (ch === "'") return "\u2019";
        return /\w/.test(next) ? "\u201c" : "\u201d";
    }

    function glyphSpan(ch, row) {
        var g = GLYPHS[ch.charCodeAt(0)];
        if (!g) return null;
        row = row || 0;
        return "<span class=\"bglyph\" style=\"width:" + (g.w * PIXEL_SCALE) +
            "px;height:" + (12 * PIXEL_SCALE) +
            "px;background-position:-" + (g.x * PIXEL_SCALE) +
            "px -" + (row * PIXEL_SCALE) + "px\"></span>";
    }

    function textUnitHtml(ch, row) {
        var s = glyphSpan(ch, row);
        return s !== null ? s : escapeHtml(ch);
    }

    function textToHtml(text, row) {
        var out = "";
        for (var i = 0; i < text.length; i++) out += textUnitHtml(text[i], row);
        return out;
    }

    function buildTextRuns(container, text, row) {
        container.innerHTML = "";
        if (!atlasReady()) {
            container.innerHTML = textToHtml(text, row);
            return;
        }
        var out = document.createDocumentFragment();
        var buf = "";
        function flush() {
            if (!buf) return;
            var c = document.createElement("canvas");
            c.className = "glyph-canvas";
            drawTextOnCanvas(c, buf, row);
            out.appendChild(c);
            buf = "";
        }
        for (var i = 0; i < text.length; i++) {
            if (text[i] === " ") {
                flush();
                out.appendChild(document.createTextNode("\u200b"));
            } else if (GLYPHS[text.charCodeAt(i)]) {
                buf += text[i];
            } else {
                flush();
                out.appendChild(document.createTextNode(text[i]));
            }
        }
        flush();
        container.appendChild(out);
    }

    var sevenTv = {};
    var sevenTvOverlay = {};
    var channelEmotesLoaded = false;

    var FFZ_MODIFIERS = {
        "ffzW": "fx-wide",
        "ffzX": "fx-flipx",
        "ffzY": "fx-flipy",
        "ffzCursed": "fx-cursed",
        "ffzRainbow": "fx-rainbow",
        "ffzHyper": "fx-hyper",
        "ffzBounce": "fx-bounce",
        "ffzJam": "fx-jam",
        "ffzSpin": "fx-spin"
    };

    function addSevenTvEmotes(emotes) {
        (emotes || []).forEach(function (e) {
            if (!e.data || !e.data.host || !e.data.host.url) return;
            var url = "https:" + e.data.host.url + "/4x.webp";
            var zeroWidth = (e.flags & 1) || (e.data && (e.data.flags & 256));
            (zeroWidth ? sevenTvOverlay : sevenTv)[e.name] = url;
        });
    }

    function loadSevenTvGlobal() {
        fetch("https://7tv.io/v3/emote-sets/global")
            .then(function (r) { return r.json(); })
            .then(function (data) { addSevenTvEmotes(data.emotes); })
            .catch(function () {});
    }

    function loadSevenTvChannel(roomId) {
        if (channelEmotesLoaded || !roomId) return;
        channelEmotesLoaded = true;
        fetch("https://7tv.io/v3/users/twitch/" + roomId)
            .then(function (r) { return r.json(); })
            .then(function (user) {
                if (!user || !user.emote_set_id) return null;
                return fetch("https://7tv.io/v3/emote-sets/" + user.emote_set_id).then(function (r) { return r.json(); });
            })
            .then(function (set) { addSevenTvEmotes(set && set.emotes); })
            .catch(function () {});
    }

    var bttv = {};
    var bttvOverlay = {};
    var bttvChannelLoaded = false;

    function addBttvEmotes(emotes) {
        (emotes || []).forEach(function (e) {
            if (!e || !e.id || !e.code) return;
            var url = "https://cdn.betterttv.net/emote/" + e.id + "/3x";
            (e.zeroWidth ? bttvOverlay : bttv)[e.code] = url;
        });
    }

    function loadBttvGlobal() {
        fetch("https://api.betterttv.net/3/cached/emotes/global")
            .then(function (r) { return r.json(); })
            .then(addBttvEmotes)
            .catch(function () {});
    }

    function loadBttvChannel(roomId) {
        if (bttvChannelLoaded || !roomId) return;
        bttvChannelLoaded = true;
        fetch("https://api.betterttv.net/3/cached/users/twitch/" + roomId)
            .then(function (r) { return r.json(); })
            .then(function (user) {
                if (!user || !user.channelEmotes) return;
                addBttvEmotes(user.channelEmotes);
                addBttvEmotes(user.sharedEmotes);
            })
            .catch(function () {});
    }

    var badges = {};
    var badgeSubFallback = "";

    function storeBadges(data) {
        (data && data.badges || []).forEach(function (b) {
            if (!b || !b.setID) return;
            var url = b.imageURL;
            if (/\/1$/.test(url)) url = url.slice(0, -1) + "3";
            var setId = b.setID;
            badges[setId + "/1"] = url;
            if (setId === "subscriber") {
                var isPlain = (b.title || "") === "Subscriber";
                var m = /^(\d+)-Month Subscriber$/.exec(b.title || "");
                if (m) badges[setId + "/" + m[1]] = url;
                if (isPlain || !badgeSubFallback) badgeSubFallback = url;
            }
        });
    }

    function loadGlobalBadges() {
        fetch("https://api.twitchinsights.net/v1/badges/global")
            .then(function (r) { return r.json(); })
            .then(storeBadges)
            .catch(function () {});
    }

    function badgeImages(userBadges) {
        var html = "";
        if (!userBadges) return html;
        Object.keys(userBadges).forEach(function (setId) {
            var url = badges[setId + "/" + userBadges[setId]];
            if (!url && setId === "subscriber") url = badgeSubFallback;
            if (url) html += "<img class=\"badge\" src=\"" + url + "\" alt=\"\">";
        });
        return html;
    }

    function resolveBadgeHtml(extra, flags) {
        var candidates = [
            extra.userBadges,
            extra.badgeInfo,
            flags && flags.badges,
            extra.userBadgesRaw
        ];
        for (var i = 0; i < candidates.length; i++) {
            if (!candidates[i]) continue;
            var h = badgeImages(candidates[i]);
            if (h) return h;
        }
        return "";
    }

    loadGlobalBadges();

    loadSevenTvGlobal();

    loadBttvGlobal();

    function emoteImg(url) {
        return "<img class=\"emote\" src=\"" + url +
            "\" alt=\"\" onerror=\"this.remove();\">";
    }

    function applyUnit(blockquote, state, unit) {
        if (unit.mod) {
            var emotes = blockquote.querySelectorAll("img.emote:not(.overlay)");
            if (emotes.length) {
                var el = emotes[emotes.length - 1];
                el.classList.add(unit.mod);
            }
        } else if (unit.glyph) {
            if (!state.lastCanvas || state.lastCanvas.parentNode !== blockquote ||
                blockquote.lastChild !== state.lastCanvas) {
                state.lastCanvas = document.createElement("canvas");
                state.lastCanvas.className = "glyph-canvas";
                state.lastCanvas._txt = "";
                blockquote.appendChild(state.lastCanvas);
            }
            state.lastCanvas._txt += unit.glyph;
            drawTextOnCanvas(state.lastCanvas, state.lastCanvas._txt, unit.row);
        } else {
            blockquote.insertAdjacentHTML("beforeend", unit.html);
            state.lastCanvas = null;
        }
        applyOverlays(blockquote);
    }

    function typeMessage(blockquote, units) {
        var state = { lastCanvas: null };
        var done = 0;
        var timer = setInterval(function () {
            if (done >= units.length) {
                clearInterval(timer);
                return;
            }
            applyUnit(blockquote, state, units[done]);
            done++;
        }, 25);
    }

    function renderAll(blockquote, units) {
        var state = { lastCanvas: null };
        for (var i = 0; i < units.length; i++) applyUnit(blockquote, state, units[i]);
    }

    function applyOverlays(blockquote) {
        blockquote.querySelectorAll("img.overlay").forEach(function (img) {
            if (img.closest(".e-stack")) return;
            var node = img.previousSibling;
            var base = null;
            while (node && node !== blockquote) {
                if (node.nodeType === 3) {
                    if (!/\S/.test(node.nodeValue.replace(/\u200b/g, ""))) {
                        node = node.previousSibling;
                        continue;
                    }
                    break;
                }
                if (node.nodeType === 1) {
                    if (node.classList.contains("emote")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("e-stack")) {
                        base = node;
                        break;
                    }
                    if (node.classList.contains("glyph-canvas") &&
                        node._txt && !/\S/.test(node._txt)) {
                        node = node.previousSibling;
                        continue;
                    }
                }
                break;
            }
            if (!base) return;
            var stack;
            if (base.classList && base.classList.contains("e-stack")) {
                stack = base;
            } else {
                stack = document.createElement("span");
                stack.className = "e-stack";
                base.parentNode.replaceChild(stack, base);
                stack.appendChild(base);
            }
            stack.appendChild(img);
        });
    }

    function parseTwitchRanges(messageEmotes) {
        var parsed = {};
        if (typeof messageEmotes === "string") {
            messageEmotes.split("/").forEach(function (group) {
                if (!group) return;
                var colon = group.indexOf(":");
                var id = group.slice(0, colon);
                var ranges = group.slice(colon + 1).split(",");
                parsed[id] = ranges.map(function (r) {
                    var dash = r.indexOf("-");
                    return [r.slice(0, dash), r.slice(dash + 1)];
                });
            });
        } else if (messageEmotes && typeof messageEmotes === "object") {
            parsed = messageEmotes;
        }
        var ranges = [];
        Object.keys(parsed).forEach(function (emoteId) {
            parsed[emoteId].forEach(function (r) {
                var start, end;
                if (typeof r === "string") {
                    var dash = r.indexOf("-");
                    start = parseInt(r.slice(0, dash), 10);
                    end = parseInt(r.slice(dash + 1), 10);
                } else {
                    start = parseInt(r[0], 10);
                    end = parseInt(r[1], 10);
                }
                ranges.push({ id: emoteId, start: start, end: end });
            });
        });
        ranges.sort(function (a, b) { return a.start - b.start; });
        return ranges;
    }

    function twitchEmoteUnit(range) {
        var url = "https://static-cdn.jtvnw.net/emoticons/v2/" +
            range.id + "/default/dark/3.0";
        return emoteImg(url);
    }

    function buildUnits(message, messageEmotes) {
        if (!currentTheme.atlas) return buildDefaultUnits(message, messageEmotes);
        var twitchRanges = parseTwitchRanges(messageEmotes);
        var units = [];
        var i = 0;

        function nearTwitchRange() {
            for (var k = 0; k < twitchRanges.length; k++) {
                if (twitchRanges[k].start === i) return twitchRanges[k];
            }
            return null;
        }

        while (i < message.length) {
            var range = nearTwitchRange();
            if (range) {
                units.push({ html: twitchEmoteUnit(range) });
                i = range.end + 1;
                continue;
            }
            if (/\s/.test(message[i])) {
                units.push(glyphOrTextUnit(message[i], 0));
                units.push({ html: "\u200b" });
                i++;
                continue;
            }
            var wordEnd = i;
            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {
                var r2 = null;
                for (var k2 = 0; k2 < twitchRanges.length; k2++) {
                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }
                if (r2) break;
                wordEnd++;
            }
            var word = message.slice(i, wordEnd);
            var overlay = false;
            var url = sevenTv[word];
            if (!url && sevenTvOverlay[word]) {
                url = sevenTvOverlay[word];
                overlay = true;
            }
            if (!url) {
                url = bttv[word];
                if (!url && bttvOverlay[word]) {
                    url = bttvOverlay[word];
                    overlay = true;
                }
            }
            if (!url) {
                var lead = 0;
                while (lead < word.length && /^[([{<]$/.test(word[lead])) lead++;
                var tail = 0;
                while (tail < word.length - lead && /^[!.,;:?)\]}>]$/.test(word[word.length - 1 - tail])) tail++;
                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push(glyphOrTextUnit(word[u], 0));
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push(glyphOrTextUnit(word[word.length - tail + u], 0));
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p = units.length - 1; p >= 0; p--) {
                    if (units[p].glyph) {
                        if (!/\S/.test(units[p].glyph)) continue;
                        prevEmote = false;
                        break;
                    }
                    var h = units[p].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h.replace(/\u200b/g, ""))) continue;
                    prevEmote = /<img /.test(h);
                    break;
                }
                if (prevEmote) {
                    units.push({ mod: fx });
                    i = wordEnd;
                    continue;
                }
            }
            if (url) {
                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;
                continue;
            }
            var wrap = 0;
            for (var c = i; c < wordEnd; c++) {
                units.push(glyphOrTextUnit(resolveQuote(message[c], message, c), 0));
                if (c < wordEnd - 1 && ++wrap >= 26) { units.push({ html: "\u200b" }); wrap = 0; }
            }
            i = wordEnd;
        }
        return units;
    }

    function buildDefaultUnits(message, messageEmotes) {
        var twitchRanges = parseTwitchRanges(messageEmotes);
        var units = [];
        var i = 0;

        function nearTwitchRange() {
            for (var k = 0; k < twitchRanges.length; k++) {
                if (twitchRanges[k].start === i) return twitchRanges[k];
            }
            return null;
        }

        while (i < message.length) {
            var range = nearTwitchRange();
            if (range) {
                units.push({ html: twitchEmoteUnit(range) });
                i = range.end + 1;
                continue;
            }
            var ch = message[i];
            if (/\s/.test(ch)) {
                units.push({ html: escapeHtml(ch) });
                i++;
                continue;
            }
            var wordEnd = i;
            while (wordEnd < message.length && !/\s/.test(message[wordEnd])) {
                var r2 = null;
                for (var k2 = 0; k2 < twitchRanges.length; k2++) {
                    if (twitchRanges[k2].start === wordEnd) { r2 = twitchRanges[k2]; break; }
                }
                if (r2) break;
                wordEnd++;
            }
            var word = message.slice(i, wordEnd);
            var overlay = false;
            var url = sevenTv[word];
            if (!url && sevenTvOverlay[word]) {
                url = sevenTvOverlay[word];
                overlay = true;
            }
            if (!url) {
                url = bttv[word];
                if (!url && bttvOverlay[word]) {
                    url = bttvOverlay[word];
                    overlay = true;
                }
            }
            if (!url) {
                var lead = 0;
                while (lead < word.length && /^[([{<]$/.test(word[lead])) lead++;
                var tail = 0;
                while (tail < word.length - lead && /^[!.,;:?)\]}>]$/.test(word[word.length - 1 - tail])) tail++;
                var core = word.slice(lead, word.length - tail);
                overlay = !!sevenTvOverlay[core] || !!bttvOverlay[core];
                url = sevenTv[core] || sevenTvOverlay[core] || bttv[core] || bttvOverlay[core];
                if (core !== word && url) {
                    var u;
                    for (u = 0; u < lead; u++) units.push({ html: escapeHtml(word[u]) });
                    units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                    for (u = 0; u < tail; u++) units.push({ html: escapeHtml(word[word.length - tail + u]) });
                    i = wordEnd;
                    continue;
                }
            }
            var fx = !url && FFZ_MODIFIERS[word];
            if (fx) {
                var prevEmote = false;
                for (var p2 = units.length - 1; p2 >= 0; p2--) {
                    var h = units[p2].html;
                    if (typeof h !== "string" || !h) continue;
                    if (!/\S/.test(h)) continue;
                    prevEmote = /<img /.test(h);
                    break;
                }
                if (prevEmote) {
                    units.push({ mod: fx });
                    i = wordEnd;
                    continue;
                }
            }
            if (url) {
                units.push({ html: emoteImg(url).replace("class=\"emote\"", overlay ? "class=\"emote overlay\"" : "class=\"emote\"") });
                i = wordEnd;
                continue;
            }
            for (var c = i; c < wordEnd; c++) units.push({ html: escapeHtml(message[c]) });
            i = wordEnd;
        }
        return units;
    }

    function appendMessage(record) {
        chatHistory.push(record);
        renderMessage(record, true);
    }

    function renderMessage(record, animate) {
        var newMessage = buildMessageNode(record);
        chat.append(newMessage);
        if (newMessage._finish) newMessage._finish(animate);
    }

    function buildMessageNode(record) {
        var user = record.user, message = record.message, flags = record.flags, extra = record.extra;
        var useAtlas = !!currentTheme.atlas;
        var newMessage = document.createElement("li");
        var blockquote = document.createElement("blockquote");
        var units = buildUnits(message, extra && extra.messageEmotes);

        if (!useAtlas) {
            var username = document.createElement("span");
            var timestamp = document.createElement("span");
            username.className = "user";
            if (flags.mod) username.classList.add("mod");
            if (flags.subscriber) username.classList.add("sub");
            if (flags.vip) username.classList.add("vip");
            username.innerHTML = resolveBadgeHtml(extra, flags) + escapeHtml(user) + ":";
            var now = new Date(record.ts || Date.now());
            var hh = String(now.getHours()).padStart(2, "0");
            var mm = String(now.getMinutes()).padStart(2, "0");
            timestamp.className = "timestamp";
            timestamp.innerText = hh + ":" + mm;
            blockquote.innerHTML = "";
            newMessage.append(username, timestamp, blockquote);
            newMessage._finish = function (animate) {
                if (animate) typeMessage(blockquote, units);
                else renderAll(blockquote, units);
            };
            return newMessage;
        }

        var box = document.createElement("div");
        var header = document.createElement("div");
        var username = document.createElement("span");
        var bg = document.createElement("canvas");
        var windowStyle = randomWindow();

        box.className = "msg-box";
        header.className = "msg-header";
        bg.className = "window-bg";

        username.className = "user username";
        var nameRow = 0;
        var rows = currentTheme.userRows;
        if (rows && rows.broadcaster != null) {
            if (flags.broadcaster) nameRow = rows.broadcaster;
            else if (flags.mod) nameRow = rows.mod;
            else if (flags.vip) nameRow = rows.vip;
            else if (flags.subscriber) nameRow = rows.sub;
        }

        buildTextRuns(username, user, nameRow);

        var badgesHtml = resolveBadgeHtml(extra, flags);
        if (badgesHtml) username.insertAdjacentHTML("afterbegin", badgesHtml);

        blockquote.className = "message-text";
        blockquote.innerHTML = "";

        header.appendChild(username);
        box.appendChild(header);
        box.appendChild(blockquote);
        newMessage.appendChild(bg);
        newMessage.appendChild(box);

        function sizeWindow() {
            if (blockquote.offsetWidth) blockquote.style.minWidth = blockquote.offsetWidth + "px";
            if (blockquote.offsetHeight) blockquote.style.minHeight = blockquote.offsetHeight + "px";
            if (windowStyle && box.offsetWidth && box.offsetHeight) {
                bg.width = box.offsetWidth;
                bg.height = box.offsetHeight;
                drawWindow(bg, windowStyle, bg.width, bg.height);
            }
        }

        function finishMessage() {
            blockquote.innerHTML = "";
            setTimeout(function () { typeMessage(blockquote, units); }, POP_MS);
        }

        function emotesReady() {
            var imgs = blockquote.querySelectorAll("img");
            for (var i = 0; i < imgs.length; i++) {
                if (!imgs[i].complete) return false;
            }
            return true;
        }

        function run(animate) {
            renderAll(blockquote, units);
            sizeWindow();
            if (!animate) return;
            if (emotesReady()) {
                finishMessage();
            } else {
                var waited = 0;
                var waiter = setInterval(function () {
                    waited += 25;
                    if (emotesReady() || waited >= 3000) {
                        clearInterval(waiter);
                        sizeWindow();
                        finishMessage();
                    }
                }, 25);
            }
        }

        blockquote.addEventListener("load", function (e) {
            if (e.target && e.target.tagName === "IMG") sizeWindow();
        }, true);
        blockquote.addEventListener("error", function (e) {
            if (e.target && e.target.tagName === "IMG") sizeWindow();
        }, true);

        newMessage._finish = function (animate) { run(animate); };
        return newMessage;
    }

    function renderAllHistory() {
        chat.innerHTML = "";
        if (notice) chat.appendChild(notice);
        for (var i = 0; i < chatHistory.length; i++) {
            renderMessage(chatHistory[i], false);
        }
    }

    ComfyJS.onChat = (user, message, flags, self, extra) => {
        loadSevenTvChannel(extra.roomId);
        loadBttvChannel(extra.roomId);
        if (user.toLowerCase() === "streamelements") return;
        appendMessage({
            user: user,
            message: message,
            flags: flags,
            extra: extra,
            ts: Date.now()
        });
    }

    var notice = null;

    function configNotice(message) {
        notice = document.createElement("li");
        notice.className = "config-notice";
        notice.textContent = message;
        chat.appendChild(notice);
    }

    var urlChannel = new URLSearchParams(location.search).get("channel");
    var channelName = urlChannel ? urlChannel.trim().replace(/^#/, "") : "";
    if (!channelName) {
        configNotice("Add ?channel=yourname to the overlay URL");
    } else {
        ComfyJS.Init(channelName);
    }

    var tuner = document.getElementById("tuner");
    var chatBox = document.getElementById("chat");
    var themeLabel = document.getElementById("tuner-theme");
    var THEME_ORDER = ["default", "ff8", "ct"];
    var themeIndex = 0;
    var TUNER_MODES = ["Left", "Center", "Right", "Alternate"];
    var tunerMode = 0;
    var tunerLabel = document.getElementById("tuner-mode");
    var dimOn = true;
    var dimBtn = document.getElementById("tuner-dim");
    var badgesOn = true;
    var badgesBtn = document.getElementById("tuner-badges");

    function applyTunerClass() {
        chatBox.className = "theme-" + currentTheme.key;
        chat.className = (["", "align-center", "align-right", "align-alternate"][tunerMode] ||
            "") + (dimOn ? " dim-past" : "") + (badgesOn ? "" : " hide-badges");
    }

    function applyTunerMode() {
        tunerLabel.textContent = TUNER_MODES[tunerMode];
        applyTunerClass();
    }

    function applyDim() {
        dimBtn.textContent = dimOn ? "On" : "Off";
        applyTunerClass();
    }

    function applyBadges() {
        badgesBtn.textContent = badgesOn ? "On" : "Off";
        applyTunerClass();
    }

    document.getElementById("theme-prev").addEventListener("click", function () {
        themeIndex = (themeIndex + THEME_ORDER.length - 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
    });

    document.getElementById("theme-next").addEventListener("click", function () {
        themeIndex = (themeIndex + 1) % THEME_ORDER.length;
        applyTheme(THEME_ORDER[themeIndex]);
    });

    document.getElementById("tuner-prev").addEventListener("click", function () {
        tunerMode = (tunerMode + TUNER_MODES.length - 1) % TUNER_MODES.length;
        applyTunerMode();
    });

    document.getElementById("tuner-next").addEventListener("click", function () {
        tunerMode = (tunerMode + 1) % TUNER_MODES.length;
        applyTunerMode();
    });

    dimBtn.addEventListener("click", function () {
        dimOn = !dimOn;
        applyDim();
    });

    badgesBtn.addEventListener("click", function () {
        badgesOn = !badgesOn;
        applyBadges();
    });

    applyTheme("default");

    document.addEventListener("keydown", function (e) {
        if (e.key === "f" || e.key === "F") {
            if (tuner) {
                tuner.classList.toggle("show");
            }
        }
    });
    </script>
